<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PontoFácil - Funcionários</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    *{margin:0;padding:0;box-sizing:border-box}

    :root{
      --azul:#2563eb;
      --azul-escuro:#0f2f66;
      --azul-noite:#071426;
      --texto:#0f172a;
      --muted:#64748b;
      --bg:#f4f7fb;
      --card:#ffffff;
      --borda:#e2e8f0;
      --verde:#16a34a;
      --vermelho:#ef4444;
      --laranja:#f59e0b;
    }

    body{
      min-height:100vh;
      background:
        radial-gradient(circle at top right, rgba(37,99,235,.10), transparent 32%),
        linear-gradient(135deg,#f8fbff,#eef3fa);
      font-family:Inter, Arial, sans-serif;
      color:var(--texto);
    }

    .layout{
      min-height:100vh;
      display:grid;
      grid-template-columns:280px 1fr;
    }

    .sidebar{
      background:
        radial-gradient(circle at top left, rgba(37,99,235,.32), transparent 38%),
        linear-gradient(180deg,#06152b,#0b2342 52%,#06152b);
      color:white;
      padding:28px 24px;
      display:flex;
      flex-direction:column;
      gap:24px;
      position:sticky;
      top:0;
      height:100vh;
      box-shadow:20px 0 60px rgba(15,23,42,.16);
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      margin-bottom:18px;
    }

    .logo-sidebar{
      width:54px;
      height:54px;
      object-fit:contain;
      flex-shrink:0;
    }

    .brand-text strong{
      display:block;
      font-size:21px;
      line-height:1;
    }

    .brand-text small{
      color:#cbd5e1;
      font-size:13px;
    }

    .menu{
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .menu button{
      width:100%;
      border:none;
      background:transparent;
      color:#cbd5e1;
      display:flex;
      align-items:center;
      gap:14px;
      padding:15px 16px;
      border-radius:14px;
      cursor:pointer;
      font-weight:800;
      font-size:15px;
      text-align:left;
      transition:.2s;
    }

    .menu button:hover,
    .menu button.active{
      background:linear-gradient(90deg,#2563eb,#1d4ed8);
      color:white;
      box-shadow:0 12px 28px rgba(37,99,235,.24);
    }

    .sidebar-footer{
      margin-top:auto;
      display:flex;
      flex-direction:column;
      gap:14px;
    }

    .empresa-card,
    .admin-card,
    .logout-card{
      border:1px solid rgba(148,163,184,.20);
      background:rgba(15,23,42,.38);
      border-radius:16px;
      padding:16px;
      backdrop-filter:blur(14px);
    }

    .empresa-card small,
    .admin-card small{
      color:#94a3b8;
      display:block;
      margin-bottom:4px;
    }

    .empresa-card strong,
    .admin-card strong{
      display:block;
      font-size:14px;
    }

    .admin-card{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .avatar{
      width:42px;
      height:42px;
      border-radius:50%;
      background:linear-gradient(135deg,#dbeafe,#93c5fd);
      color:#1e3a8a;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:900;
      flex-shrink:0;
    }

    .online{
      color:#22c55e!important;
      font-size:12px!important;
      margin-top:4px;
    }

    .logout-card{
      width:100%;
      color:#cbd5e1;
      border:none;
      display:flex;
      align-items:center;
      gap:12px;
      cursor:pointer;
      font-weight:800;
    }

    .main{
      padding:34px 42px 28px;
      min-width:0;
    }

    .topo{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:20px;
      margin-bottom:30px;
      flex-wrap:wrap;
    }

    .titulo h1{
      color:#0f274c;
      font-size:36px;
      line-height:1;
      letter-spacing:-1px;
      margin-bottom:10px;
      font-weight:900;
    }

    .titulo p{
      color:var(--muted);
      font-size:16px;
      font-weight:700;
    }

    .top-actions{
      display:flex;
      align-items:center;
      gap:14px;
      flex-wrap:wrap;
    }

    .btn-top{
      height:58px;
      border:none;
      border-radius:14px;
      padding:0 20px;
      font-weight:900;
      cursor:pointer;
      color:white;
      display:flex;
      align-items:center;
      gap:10px;
      box-shadow:0 12px 30px rgba(37,99,235,.18);
      font-size:14px;
      font-family:Inter, Arial, sans-serif;
    }

    .btn-blue{background:linear-gradient(90deg,#2563eb,#1d4ed8)}
    .btn-white{background:white;color:#2563eb}
    .btn-red{background:#ef4444}
    .btn-dark{background:#0f274c}

    .card{
      background:white;
      border-radius:24px;
      padding:28px;
      box-shadow:0 18px 46px rgba(15,23,42,.06);
      border:1px solid rgba(226,232,240,.90);
      margin-bottom:28px;
    }

    .card-header{
      display:flex;
      align-items:center;
      gap:18px;
      margin-bottom:26px;
    }

    .icone-card{
      width:64px;
      height:64px;
      border-radius:20px;
      background:linear-gradient(135deg,#2563eb,#1d4ed8);
      display:flex;
      justify-content:center;
      align-items:center;
      color:white;
      font-size:25px;
      flex-shrink:0;
      box-shadow:0 14px 30px rgba(37,99,235,.25);
    }

    .card-header h2{
      font-size:32px;
      margin-bottom:6px;
      color:#0f172a;
      letter-spacing:-.5px;
    }

    .card-header p{color:#64748b;font-size:16px;font-weight:700}

    .grid{
      display:grid;
      grid-template-columns:260px repeat(4,1fr);
      gap:18px;
      margin-bottom:24px;
      align-items:start;
    }

    .upload-box{
      border:2px dashed #cbd5e1;
      border-radius:22px;
      min-height:180px;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
      cursor:pointer;
      padding:18px;
      background:#f8fbff;
      transition:.2s;
    }

    .upload-box:hover{
      border-color:#2563eb;
      background:#eff6ff;
    }

    .upload-box i{font-size:42px;color:#2563eb;margin-bottom:14px}
    .upload-box strong{font-size:18px;color:#2563eb}
    .upload-box span{margin-top:6px;color:#64748b;font-size:14px;font-weight:700}

    .campo{display:flex;flex-direction:column;gap:8px}
    .campo label{font-size:15px;color:#334155;font-weight:900}

    .input-icon{position:relative}

    .input-icon i{
      position:absolute;
      left:16px;
      top:50%;
      transform:translateY(-50%);
      color:#64748b;
      font-size:16px;
    }

    .input-icon input{padding-left:46px!important}

    .checkbox-sem-intervalo{
  display:flex;
  flex-direction:column;
  gap:8px;
  padding-top:23px;
}

.checkbox-sem-intervalo label{
  width:100%;
  height:54px;
  display:flex;
  align-items:center;
  gap:10px;
  background:#eff6ff;
  border:1px solid #dbeafe;
  border-radius:16px;
  padding:0 16px;
  color:#2563eb;
  font-weight:900;
  cursor:pointer;
}

.checkbox-sem-intervalo input{
  width:18px;
  height:18px;
  accent-color:#2563eb;
  flex-shrink:0;
}
    
    input{
      width:100%;
      height:54px;
      border-radius:16px;
      border:1px solid #dbe4f0;
      padding:0 18px;
      font-size:16px;
      color:#0f172a;
      background:white;
      font-family:Inter, Arial, sans-serif;
      transition:.2s;
    }

    input:focus, select:focus{
      outline:none;
      border-color:#2563eb;
      box-shadow:0 0 0 4px rgba(37,99,235,.12);
    }

    .btn-salvar{
      width:100%;
      height:60px;
      border:none;
      border-radius:18px;
      background:linear-gradient(90deg,#2563eb,#1d4ed8);
      color:white;
      font-size:20px;
      font-weight:900;
      cursor:pointer;
      display:flex;
      justify-content:center;
      align-items:center;
      gap:10px;
      box-shadow:0 14px 30px rgba(37,99,235,.25);
    }

    .funcionarios-topo{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:18px;
      margin-bottom:24px;
      flex-wrap:wrap;
    }

    .funcionarios-topo h2{
      font-size:30px;
      margin-bottom:6px;
      color:#0f172a;
      letter-spacing:-.5px;
    }

    .funcionarios-topo p{color:#64748b;font-size:15px;font-weight:700}

    .contador{
      background:#eff6ff;
      color:#2563eb;
      font-size:13px;
      padding:7px 12px;
      border-radius:999px;
      font-weight:900;
      margin-left:8px;
    }

    .filtros{display:flex;gap:12px;flex-wrap:wrap}

    .pesquisa{position:relative}

    .pesquisa i{
      position:absolute;
      left:16px;
      top:50%;
      transform:translateY(-50%);
      color:#64748b;
    }

    .pesquisa input{
      width:280px;
      height:52px;
      padding-left:44px;
      font-size:15px;
    }

    select{
      height:52px;
      border-radius:16px;
      border:1px solid #dbe4f0;
      padding:0 16px;
      font-size:15px;
      background:white;
      color:#0f172a;
      min-width:150px;
      font-family:Inter, Arial, sans-serif;
    }

    .funcionario{
      border:1px solid #e2e8f0;
      border-radius:24px;
      padding:22px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:22px;
      margin-bottom:18px;
      transition:.2s;
      background:white;
    }

    .funcionario:hover{
      transform:translateY(-2px);
      box-shadow:0 16px 34px rgba(15,23,42,.06);
    }

    .dados{
      display:flex;
      align-items:center;
      gap:18px;
      flex:1;
      min-width:260px;
    }

    .foto{
      width:82px;
      height:82px;
      border-radius:20px;
      object-fit:cover;
      background:#e2e8f0;
      flex-shrink:0;
    }

    .foto-placeholder{
      width:82px;
      height:82px;
      border-radius:20px;
      background:#f1f5f9;
      display:flex;
      justify-content:center;
      align-items:center;
      color:#cbd5e1;
      font-size:30px;
      flex-shrink:0;
    }

    .dados strong{font-size:22px;display:block;margin-bottom:6px;color:#0f172a}

    .dados small{
      display:block;
      color:#64748b;
      font-size:15px;
      line-height:1.7;
      font-weight:700;
    }

    .dados small i{width:22px;color:#475569}

    .status{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:8px 14px;
      border-radius:999px;
      font-size:13px;
      font-weight:900;
      margin-top:10px;
    }

    .ativo{background:#dcfce7;color:#166534}
    .inativo{background:#fee2e2;color:#991b1b}

    .acoes{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
    }

    .btn-acao{
      height:50px;
      padding:0 18px;
      border-radius:14px;
      border:none;
      font-size:14px;
      font-weight:900;
      cursor:pointer;
      display:flex;
      align-items:center;
      gap:8px;
      font-family:Inter, Arial, sans-serif;
    }

    .editar{
      background:#fff7ed;
      color:#f59e0b;
      border:1px solid #fdba74;
    }

    .inativar{
      background:#64748b;
      color:white;
    }

    .footer-lista{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-top:18px;
      flex-wrap:wrap;
      gap:18px;
    }

    .footer-lista p{color:#64748b;font-size:14px;font-weight:700}

    .vazio{
      color:#64748b;
      font-style:italic;
      padding:14px 0;
    }

    .mobile-menu{
      display:none;
      margin-bottom:18px;
      gap:10px;
      flex-wrap:wrap;
    }

    .mobile-menu button{
      border:none;
      border-radius:12px;
      background:#0f274c;
      color:white;
      padding:12px 14px;
      font-weight:900;
      cursor:pointer;
    }

    @media(max-width:1280px){
      .grid{grid-template-columns:1fr 1fr}
    }

    @media(max-width:1020px){
      .layout{grid-template-columns:1fr}
      .sidebar{display:none}
      .main{padding:24px}
      .mobile-menu{display:flex}
    }

    @media(max-width:900px){
      .grid{grid-template-columns:1fr}
      .funcionario{flex-direction:column;align-items:flex-start}
      .acoes{width:100%}
      .btn-acao{flex:1;justify-content:center}
      .card-header h2{font-size:24px}
      .funcionarios-topo h2{font-size:24px}
      .top-actions{width:100%}
      .btn-top{flex:1;justify-content:center}
    }

    @media(max-width:640px){
      .main{padding:16px}
      .titulo h1{font-size:32px}
      .pesquisa input{width:100%}
      .filtros{width:100%}
      .pesquisa{width:100%}
      select{width:100%}
    }
  </style>
</head>

<body>

<div class="layout">

  <aside class="sidebar">
    <div class="brand">
      <img src="./pontofacil-icone.png" alt="PontoFácil" class="logo-sidebar">
      <div class="brand-text">
        <strong>PontoFácil</strong>
        <small>Gestão de Ponto</small>
      </div>
    </div>

    <nav class="menu">
      <button onclick="window.location.href='./dashboard.html'"><i data-lucide="layout-dashboard"></i> Dashboard</button>
      <button class="active"><i data-lucide="users"></i> Funcionários</button>
      <button onclick="window.location.href='./relatorio.html'"><i data-lucide="clipboard-list"></i> Registros</button>
    </nav>

    <div class="sidebar-footer">
      <div class="empresa-card">
        <small>Empresa</small>
        <strong id="empresaNomeSidebar">PontoFácil</strong>
      </div>

      <div class="admin-card">
        <div class="avatar">A</div>
        <div>
          <strong>Administrador</strong>
          <small>Gestor</small>
          <small class="online">● Online</small>
        </div>
      </div>

      <button class="logout-card" onclick="sair()">
        <i data-lucide="log-out"></i> Sair
      </button>
    </div>
  </aside>

  <main class="main">
    <div class="mobile-menu">
      <button onclick="gerarQRCode()">QR Code</button>
      <button onclick="window.location.href='./dashboard.html'">Dashboard</button>
      <button onclick="window.location.href='./relatorio.html'">Registros</button>
      <button onclick="sair()">Sair</button>
    </div>

    <div class="topo">
      <div class="titulo">
        <h1 id="empresaNome">PontoFácil</h1>
        <p>Painel da gestão da empresa</p>
      </div>

      <div class="top-actions">
        <button class="btn-top btn-white" onclick="gerarQRCode()">
          <i class="fa-solid fa-qrcode"></i> QR Code
        </button>

        <button class="btn-top btn-blue" onclick="window.location.href='./dashboard.html'">
          <i class="fa-solid fa-chart-column"></i> Dashboard
        </button>

        <button class="btn-top btn-white" onclick="window.location.href='./relatorio.html'">
          <i class="fa-regular fa-calendar"></i> Registros
        </button>

        <button class="btn-top btn-white" onclick="window.location.href='./banco-horas.html'">
          <i class="fa-regular fa-clock"></i> Banco de horas
        </button>

        <button class="btn-top btn-red" onclick="sair()">
          <i class="fa-solid fa-arrow-right-from-bracket"></i> Sair
        </button>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <div class="icone-card">
          <i class="fa-solid fa-user-plus"></i>
        </div>

        <div>
          <h2>Cadastrar funcionário</h2>
          <p>Preencha os dados para cadastrar um novo funcionário.</p>
        </div>
      </div>

      <div class="grid">

        <label class="upload-box">
          <i class="fa-solid fa-cloud-arrow-up"></i>
          <strong>Clique para enviar</strong>
          <span>PNG, JPG até 5MB</span>
          <input id="foto" type="file" accept="image/*" hidden>
        </label>

        <div class="campo">
          <label>Nome completo</label>
          <div class="input-icon">
            <i class="fa-regular fa-user"></i>
            <input id="nome" placeholder="Ex: João da Silva">
          </div>
        </div>

        <div class="campo">
          <label>CPF</label>
          <div class="input-icon">
            <i class="fa-regular fa-id-card"></i>
            <input id="cpf" placeholder="000.000.000-00">
          </div>
        </div>

        <div class="campo">
          <label>Função</label>
          <div class="input-icon">
            <i class="fa-solid fa-briefcase"></i>
            <input id="funcao" placeholder="Ex: Recepcionista">
          </div>
        </div>

        <div class="campo">
          <label>Data de nascimento</label>
          <div class="input-icon">
            <i class="fa-regular fa-calendar"></i>
            <input id="data_nascimento" type="date">
          </div>
        </div>

        <div class="campo">
          <label>Horário de entrada</label>
          <div class="input-icon">
            <i class="fa-regular fa-clock"></i>
            <input id="horario_entrada" type="time">
          </div>
        </div>
    
        <div class="campo" id="campo_intervalo_saida">
  <label>Saída para intervalo</label>
          <div class="input-icon">
            <i class="fa-regular fa-clock"></i>
            <input id="horario_intervalo" type="time">
          </div>
        </div>

        <div class="campo" id="campo_intervalo_retorno">
  <label>Retorno do intervalo</label>
          <div class="input-icon">
            <i class="fa-regular fa-clock"></i>
            <input id="horario_retorno" type="time">
          </div>
        </div>

        <div class="campo">
          <label>Horário de saída</label>
          <div class="input-icon">
            <i class="fa-regular fa-clock"></i>
            <input id="horario_saida" type="time">
          </div>
        </div>

        <div class="campo checkbox-sem-intervalo">
  <label>
    <input
      type="checkbox"
      id="sem_intervalo"
      onchange="toggleIntervalo()"
    >
    Funcionário sem intervalo
  </label>
</div>
        
      </div>
      
      <button class="btn-salvar" onclick="salvarFuncionario()">
        <i class="fa-regular fa-floppy-disk"></i>
        Salvar funcionário
      </button>
    </div>

    <div class="card">
      <div class="funcionarios-topo">
        <div>
          <h2>
            Funcionários cadastrados
            <span class="contador" id="contadorFuncionarios">0</span>
          </h2>
          <p>Lista de todos os funcionários da empresa.</p>
        </div>

        <div class="filtros">
          <div class="pesquisa">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input id="buscaFuncionario" placeholder="Buscar funcionário..." oninput="renderizarFuncionarios()">
          </div>

          <select id="filtroStatus" onchange="renderizarFuncionarios()">
            <option value="todos">Todos</option>
            <option value="ativos">Ativos</option>
            <option value="inativos">Inativos</option>
          </select>
        </div>
      </div>

      <div id="listaFuncionarios"></div>

      <div class="footer-lista">
        <p id="textoQuantidade">Mostrando 0 funcionários</p>
      </div>
    </div>
  </main>
</div>

<script>
  const supabaseUrl = "https://ixeeperktitbzmnvcaqz.supabase.co";

  const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml4ZWVwZXJrdGl0YnptbnZjYXF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3Njg1MTEsImV4cCI6MjA5NDM0NDUxMX0.E4nC-w8XRpk_X7vghkGfbXuJUHQneLUJy2DLw9NsuVQ";

  const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

  const empresaId = localStorage.getItem("pontofacil_empresa_id");
  const empresaNome = localStorage.getItem("pontofacil_empresa_nome");

  let funcionarios = [];

  if(!empresaId){
    window.location.href = "./gestao.html";
  }

  document.getElementById("empresaNome").innerText = empresaNome || "PontoFácil";
  document.getElementById("empresaNomeSidebar").innerText = empresaNome || "PontoFácil";

  function sair(){
    localStorage.removeItem("pontofacil_empresa_logada");
    localStorage.removeItem("pontofacil_empresa_id");
    localStorage.removeItem("pontofacil_empresa_nome");
    localStorage.removeItem("pontofacil_empresa_email");
    window.location.href = "./gestao.html";
  }

function toggleIntervalo(){

  const semIntervalo =
  document.getElementById("sem_intervalo").checked;

  const campoSaida =
  document.getElementById("campo_intervalo_saida");

  const campoRetorno =
  document.getElementById("campo_intervalo_retorno");

  if(semIntervalo){

    campoSaida.style.display = "none";
    campoRetorno.style.display = "none";

    document.getElementById("horario_intervalo").value = "";
    document.getElementById("horario_retorno").value = "";

  }else{

    campoSaida.style.display = "";
    campoRetorno.style.display = "";

  }

}
  
  function normalizarNomeArquivo(texto){
    return String(texto || "")
      .toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/^-+|-+$/g, "");
  }

  async function enviarFotoFuncionario(nomeFuncionario){
    const inputFoto = document.getElementById("foto");

    if(!inputFoto.files || inputFoto.files.length === 0){
      return "";
    }

    const arquivo = inputFoto.files[0];
    const extensao = arquivo.name.split(".").pop().toLowerCase();
    const nomeArquivo = `${empresaId}/${normalizarNomeArquivo(nomeFuncionario)}-${Date.now()}.${extensao}`;

    const { error: uploadError } = await supabaseClient
      .storage
      .from("funcionarios")
      .upload(nomeArquivo, arquivo, {
        cacheControl: "3600",
        upsert: false
      });

    if(uploadError){
      console.log("Erro ao enviar foto:", uploadError);
      alert("Erro ao enviar foto do funcionário.");
      return null;
    }

    const { data: urlData } = supabaseClient
      .storage
      .from("funcionarios")
      .getPublicUrl(nomeArquivo);

    return urlData.publicUrl;
  }

  async function salvarFuncionario(){
    const nome = document.getElementById("nome").value.trim();
    const cpf = document.getElementById("cpf").value.trim();
    const funcao = document.getElementById("funcao").value.trim();
    const data_nascimento = document.getElementById("data_nascimento").value;
    const horario_entrada = document.getElementById("horario_entrada").value;
    const horario_intervalo = document.getElementById("horario_intervalo").value;
    const horario_retorno = document.getElementById("horario_retorno").value;
    const horario_saida = document.getElementById("horario_saida").value;
    const sem_intervalo = document.getElementById("sem_intervalo").checked;

    if(!nome){
      alert("Informe o nome do funcionário.");
      return;
    }

    const fotoUrl = await enviarFotoFuncionario(nome);

    if(fotoUrl === null){
      return;
    }

    const { error } = await supabaseClient
      .from("funcionarios")
      .insert([
        {
          empresa_id: empresaId,
          nome_completo: nome,
          cpf,
          funcao,
          data_nascimento: data_nascimento || null,
          foto_url: fotoUrl || "",
          horario_entrada: horario_entrada || null,
          horario_intervalo: horario_intervalo || null,
          horario_retorno: horario_retorno || null,
          horario_saida: horario_saida || null,
          sem_intervalo,
          ativo: true
        }
      ]);

    if(error){
      console.log(error);
      alert("Erro ao salvar funcionário.");
      return;
    }

    alert("Funcionário cadastrado.");

    document.getElementById("foto").value = "";
    document.getElementById("nome").value = "";
    document.getElementById("cpf").value = "";
    document.getElementById("funcao").value = "";
    document.getElementById("data_nascimento").value = "";
    document.getElementById("horario_entrada").value = "";
    document.getElementById("horario_intervalo").value = "";
    document.getElementById("horario_retorno").value = "";
    document.getElementById("horario_saida").value = "";
    document.getElementById("sem_intervalo").checked = false;
    toggleIntervalo();
    carregarFuncionarios();
  }

  async function carregarFuncionarios(){
    const { data, error } = await supabaseClient
      .from("funcionarios")
      .select("*")
      .eq("empresa_id", empresaId)
      .order("nome_completo");

    if(error){
      console.log(error);
      document.getElementById("listaFuncionarios").innerHTML =
        `<div class="vazio">Erro ao carregar funcionários.</div>`;
      return;
    }

    funcionarios = data || [];
    renderizarFuncionarios();
  }

  function renderizarFuncionarios(){
    const lista = document.getElementById("listaFuncionarios");
    const busca = document.getElementById("buscaFuncionario").value.toLowerCase().trim();
    const status = document.getElementById("filtroStatus").value;

    let filtrados = funcionarios;

    if(status === "ativos"){
      filtrados = filtrados.filter(f => f.ativo === true);
    }

    if(status === "inativos"){
      filtrados = filtrados.filter(f => f.ativo === false);
    }

    if(busca){
      filtrados = filtrados.filter(f =>
        String(f.nome_completo || "").toLowerCase().includes(busca) ||
        String(f.cpf || "").toLowerCase().includes(busca) ||
        String(f.funcao || "").toLowerCase().includes(busca)
      );
    }

    document.getElementById("contadorFuncionarios").textContent = filtrados.length;
    document.getElementById("textoQuantidade").textContent =
      `Mostrando ${filtrados.length} de ${funcionarios.length} funcionários`;

    if(filtrados.length === 0){
      lista.innerHTML = `<div class="vazio">Nenhum funcionário encontrado.</div>`;
      return;
    }

    lista.innerHTML = filtrados.map(funcionario => `
      <div class="funcionario">
        <div class="dados">
          ${
            funcionario.foto_url
            ? `<img class="foto" src="${funcionario.foto_url}" onerror="this.outerHTML='<div class=&quot;foto-placeholder&quot;><i class=&quot;fa-solid fa-user&quot;></i></div>'">`
            : `<div class="foto-placeholder"><i class="fa-solid fa-user"></i></div>`
          }

          <div>
            <strong>${funcionario.nome_completo}</strong>

            <small><i class="fa-regular fa-id-card"></i> CPF: ${funcionario.cpf || "-"}</small>
            <small><i class="fa-solid fa-briefcase"></i> Função: ${funcionario.funcao || "-"}</small>
            <small><i class="fa-regular fa-clock"></i> Horários: ${funcionario.horario_entrada || "--:--"} / ${funcionario.horario_intervalo || "--:--"} / ${funcionario.horario_retorno || "--:--"} / ${funcionario.horario_saida || "--:--"}</small>

            <span class="status ${funcionario.ativo ? "ativo" : "inativo"}">
              ● ${funcionario.ativo ? "ATIVO" : "INATIVO"}
            </span>
          </div>
        </div>

        <div class="acoes">
          <button
            class="btn-acao editar"
            onclick="editarFuncionario(
              '${funcionario.id}',
              '${escapeTexto(funcionario.nome_completo)}',
              '${escapeTexto(funcionario.cpf)}',
              '${escapeTexto(funcionario.funcao)}'
            )"
          >
            <i class="fa-solid fa-pen"></i>
            Editar
          </button>

          <button
            class="btn-acao inativar"
            onclick="alterarStatusFuncionario('${funcionario.id}', ${funcionario.ativo})"
          >
            <i class="fa-solid ${funcionario.ativo ? "fa-pause" : "fa-play"}"></i>
            ${funcionario.ativo ? "Inativar" : "Ativar"}
          </button>
        </div>
      </div>
    `).join("");
  }

  function escapeTexto(texto){
    return String(texto || "")
      .replace(/\\/g, "\\\\")
      .replace(/'/g, "\\'")
      .replace(/"/g, "&quot;");
  }

  async function editarFuncionario(id, nomeAtual, cpfAtual, funcaoAtual){
    const novoNome = prompt("Nome:", nomeAtual);
    if(novoNome === null) return;

    const novoCpf = prompt("CPF:", cpfAtual);
    if(novoCpf === null) return;

    const novaFuncao = prompt("Função:", funcaoAtual);
    if(novaFuncao === null) return;

    const { error } = await supabaseClient
      .from("funcionarios")
      .update({
        nome_completo: novoNome.trim(),
        cpf: novoCpf.trim(),
        funcao: novaFuncao.trim()
      })
      .eq("id", id);

    if(error){
      console.log(error);
      alert("Erro ao editar funcionário.");
      return;
    }

    carregarFuncionarios();
  }

  async function alterarStatusFuncionario(id, statusAtual){
    const confirmar = confirm(
      statusAtual
        ? "Deseja inativar este funcionário?"
        : "Deseja ativar este funcionário?"
    );

    if(!confirmar) return;

    const { error } = await supabaseClient
      .from("funcionarios")
      .update({
        ativo: !statusAtual
      })
      .eq("id", id);

    if(error){
      console.log(error);
      alert("Erro ao alterar status.");
      return;
    }

    carregarFuncionarios();
  }

  carregarFuncionarios();
