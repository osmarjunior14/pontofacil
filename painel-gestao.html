<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PontoFácil - Gestão</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      font-family:Arial, sans-serif;
      background:#f4f7fb;
      color:#0f172a;
      padding:24px;
    }

    .container{
      max-width:1300px;
      margin:auto;
    }

    .topo{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:26px;
      gap:16px;
      flex-wrap:wrap;
    }

    h1{
      color:#2563eb;
      font-size:34px;
    }

    .sub{
      color:#64748b;
      margin-top:4px;
    }

    .btn-sair{
      background:#ef4444;
      color:white;
      border:none;
      border-radius:12px;
      padding:12px 16px;
      font-weight:bold;
      cursor:pointer;
    }

    .card{
      background:white;
      border-radius:22px;
      padding:22px;
      box-shadow:0 12px 35px rgba(15,23,42,.08);
      margin-bottom:24px;
    }

    h2{
      margin-bottom:18px;
      font-size:24px;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:14px;
    }

    input{
      width:100%;
      padding:14px;
      border-radius:12px;
      border:1px solid #dbe4f0;
      font-size:15px;
    }

    input:focus{
      outline:none;
      border-color:#2563eb;
      box-shadow:0 0 0 4px rgba(37,99,235,.12);
    }

    .btn{
      margin-top:14px;
      width:100%;
      padding:14px;
      border:none;
      border-radius:12px;
      background:#2563eb;
      color:white;
      font-weight:bold;
      cursor:pointer;
      font-size:15px;
    }

    .funcionario{
      border:1px solid #e2e8f0;
      border-radius:18px;
      padding:16px;
      margin-bottom:14px;
      display:flex;
      justify-content:space-between;
      gap:18px;
      flex-wrap:wrap;
      align-items:center;
    }

    .funcionario strong{
      display:block;
      font-size:18px;
      margin-bottom:6px;
    }

    .funcionario small{
      display:block;
      color:#64748b;
      line-height:1.6;
    }

    .status{
      display:inline-block;
      margin-top:8px;
      padding:5px 10px;
      border-radius:999px;
      font-size:12px;
      font-weight:bold;
    }

    .ativo{
      background:#dcfce7;
      color:#166534;
    }

    .inativo{
      background:#fee2e2;
      color:#991b1b;
    }

    .acoes{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }

    .acoes button{
      border:none;
      border-radius:10px;
      padding:10px 12px;
      font-weight:bold;
      color:white;
      cursor:pointer;
    }

    .editar{
      background:#f59e0b;
    }

    .inativar{
      background:#64748b;
    }

    .vazio{
      color:#64748b;
      font-style:italic;
    }

    @media(max-width:700px){

      body{
        padding:16px;
      }

      .funcionario{
        align-items:flex-start;
      }

      .acoes{
        width:100%;
      }

      .acoes button{
        flex:1;
      }

    }

  </style>
</head>
<body>

<div class="container">

  <div class="topo">

    <div>
      <h1 id="empresaNome">PontoFácil</h1>
      <div class="sub">Painel da gestão da empresa</div>
    </div>

    <button class="btn-sair" onclick="sair()">
      Sair
    </button>

  </div>

  <div class="card">

    <h2>Cadastrar funcionário</h2>

    <div class="grid">

      <input id="nome" placeholder="Nome completo">

      <input id="cpf" placeholder="CPF">

      <input id="funcao" placeholder="Função">

      <input id="data_nascimento" type="date">

      <input id="horario_entrada" type="time">

      <input id="horario_intervalo" type="time">

      <input id="horario_retorno" type="time">

      <input id="horario_saida" type="time">

    </div>

    <button class="btn" onclick="salvarFuncionario()">
      Salvar funcionário
    </button>

  </div>

  <div class="card">

    <h2>Funcionários cadastrados</h2>

    <div id="listaFuncionarios"></div>

  </div>

</div>

<script>

const supabaseUrl = "https://ixeeperktitbzmnvcaqz.supabase.co";

const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml4ZWVwZXJrdGl0YnptbnZjYXF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3Njg1MTEsImV4cCI6MjA5NDM0NDUxMX0.E4nC-w8XRpk_X7vghkGfbXuJUHQneLUJy2DLw9NsuVQ";

const supabaseClient = window.supabase.createClient(
  supabaseUrl,
  supabaseKey
);

const empresaId = localStorage.getItem("pontofacil_empresa_id");
const empresaNome = localStorage.getItem("pontofacil_empresa_nome");

if(!empresaId){
  window.location.href = "./gestao.html";
}

document.getElementById("empresaNome").innerText = empresaNome;

function sair(){

  localStorage.removeItem("pontofacil_empresa_logada");
  localStorage.removeItem("pontofacil_empresa_id");
  localStorage.removeItem("pontofacil_empresa_nome");
  localStorage.removeItem("pontofacil_empresa_email");

  window.location.href = "./gestao.html";

}

async function salvarFuncionario(){

  const nome = document.getElementById("nome").value.trim();
  const cpf = document.getElementById("cpf").value.trim();
  const funcao = document.getElementById("funcao").value.trim();
  const data_nascimento = document.getElementById("data_nascimento").value;
  const horario_entrada = document.getElementById("horario_entrada").value;
  const horario_intervalo = document.getElementById("horario_intervalo").value;
  const horario_retorno = document.getElementById("horario_retorno").value;
  const horario_saida = document.getElementById("horario_saida").value;

  if(!nome){
    alert("Informe o nome do funcionário.");
    return;
  }

  const { error } = await supabaseClient
    .from("funcionarios")
    .insert([
      {
        empresa_id:empresaId,
        nome_completo:nome,
        cpf,
        funcao,
        data_nascimento,
        horario_entrada,
        horario_intervalo,
        horario_retorno,
        horario_saida,
        ativo:true
      }
    ]);

  if(error){
    console.log(error);
    alert("Erro ao salvar funcionário.");
    return;
  }

  alert("Funcionário cadastrado.");

  document.getElementById("nome").value = "";
  document.getElementById("cpf").value = "";
  document.getElementById("funcao").value = "";
  document.getElementById("data_nascimento").value = "";
  document.getElementById("horario_entrada").value = "";
  document.getElementById("horario_intervalo").value = "";
  document.getElementById("horario_retorno").value = "";
  document.getElementById("horario_saida").value = "";

  carregarFuncionarios();

}

async function carregarFuncionarios(){

  const { data, error } = await supabaseClient
    .from("funcionarios")
    .select("*")
    .eq("empresa_id", empresaId)
    .order("nome_completo");

  const lista = document.getElementById("listaFuncionarios");

  if(error){
    console.log(error);
    lista.innerHTML = `<div class="vazio">Erro ao carregar funcionários.</div>`;
    return;
  }

  if(!data || data.length === 0){
    lista.innerHTML = `<div class="vazio">Nenhum funcionário cadastrado.</div>`;
    return;
  }

  lista.innerHTML = data.map(funcionario => `

    <div class="funcionario">

      <div>

        <strong>${funcionario.nome_completo}</strong>

        <small><b>CPF:</b> ${funcionario.cpf || "-"}</small>

        <small><b>Função:</b> ${funcionario.funcao || "-"}</small>

        <small>
          <b>Horários:</b>
          ${funcionario.horario_entrada || "--:--"} /
          ${funcionario.horario_intervalo || "--:--"} /
          ${funcionario.horario_retorno || "--:--"} /
          ${funcionario.horario_saida || "--:--"}
        </small>

        <span class="status ${funcionario.ativo ? "ativo" : "inativo"}">
          ${funcionario.ativo ? "ATIVO" : "INATIVO"}
        </span>

      </div>

      <div class="acoes">

        <button
          class="editar"
          onclick="editarFuncionario(
            '${funcionario.id}',
            '${escapeTexto(funcionario.nome_completo)}',
            '${escapeTexto(funcionario.cpf)}',
            '${escapeTexto(funcionario.funcao)}'
          )"
        >
          Editar
        </button>

        <button
          class="inativar"
          onclick="alterarStatusFuncionario('${funcionario.id}', ${funcionario.ativo})"
        >
          ${funcionario.ativo ? "Inativar" : "Ativar"}
        </button>

      </div>

    </div>

  `).join("");

}

function escapeTexto(texto){

  return String(texto || "")
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'")
    .replace(/"/g, "&quot;");

}

async function editarFuncionario(id, nomeAtual, cpfAtual, funcaoAtual){

  const novoNome = prompt("Nome:", nomeAtual);
  if(novoNome === null) return;

  const novoCpf = prompt("CPF:", cpfAtual);
  if(novoCpf === null) return;

  const novaFuncao = prompt("Função:", funcaoAtual);
  if(novaFuncao === null) return;

  const { error } = await supabaseClient
    .from("funcionarios")
    .update({
      nome_completo:novoNome,
      cpf:novoCpf,
      funcao:novaFuncao
    })
    .eq("id", id);

  if(error){
    console.log(error);
    alert("Erro ao editar funcionário.");
    return;
  }

  carregarFuncionarios();

}

async function alterarStatusFuncionario(id, statusAtual){

  const confirmar = confirm(
    statusAtual
      ? "Deseja inativar este funcionário?"
      : "Deseja ativar este funcionário?"
  );

  if(!confirmar) return;

  const { error } = await supabaseClient
    .from("funcionarios")
    .update({
      ativo:!statusAtual
    })
    .eq("id", id);

  if(error){
    console.log(error);
    alert("Erro ao alterar status.");
    return;
  }

  carregarFuncionarios();

}

carregarFuncionarios();

</script>

</body>
</html>
