<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PontoFácil - Painel Gestão</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  background:#f4f7fb;
  font-family:Inter, Arial, sans-serif;
  color:#0f172a;
  padding:24px;
}

.container{max-width:1450px;margin:auto}

.topo{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:18px;
  margin-bottom:28px;
  flex-wrap:wrap;
}

.titulo h1{
  font-size:28px;
  color:#2563eb;
  line-height:1.1;
  margin-bottom:6px;
  font-weight:800;
}

.titulo p{color:#64748b;font-size:16px;font-weight:500}

.botoes-topo{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  justify-content:flex-end;
}

.btn-topo{
  height:48px;
  padding:0 18px;
  border:none;
  border-radius:14px;
  background:white;
  color:#2563eb;
  font-weight:700;
  font-size:14px;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:8px;
  box-shadow:0 6px 18px rgba(15,23,42,.05);
}

.btn-sair{background:#ef4444;color:white}

.card{
  background:white;
  border-radius:24px;
  padding:28px;
  box-shadow:0 12px 35px rgba(15,23,42,.05);
  margin-bottom:28px;
}

.card-header{
  display:flex;
  align-items:center;
  gap:16px;
  margin-bottom:24px;
}

.icone-card{
  width:58px;
  height:58px;
  border-radius:18px;
  background:linear-gradient(135deg,#2563eb,#1d4ed8);
  display:flex;
  justify-content:center;
  align-items:center;
  color:white;
  font-size:22px;
  flex-shrink:0;
}

.card-header h2{font-size:30px;margin-bottom:4px;color:#0f172a}
.card-header p{color:#64748b;font-size:15px}

.grid{
  display:grid;
  grid-template-columns:260px repeat(4,1fr);
  gap:18px;
  margin-bottom:22px;
}

.upload-box{
  border:2px dashed #cbd5e1;
  border-radius:22px;
  min-height:180px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  cursor:pointer;
  padding:18px;
}

.upload-box i{font-size:42px;color:#2563eb;margin-bottom:14px}
.upload-box strong{font-size:18px;color:#2563eb}
.upload-box span{margin-top:6px;color:#64748b;font-size:14px}

.campo{display:flex;flex-direction:column;gap:8px}
.campo label{font-size:15px;color:#334155;font-weight:700}

.input-icon{position:relative}

.input-icon i{
  position:absolute;
  left:16px;
  top:50%;
  transform:translateY(-50%);
  color:#64748b;
  font-size:16px;
}

.input-icon input{padding-left:46px!important}

input{
  width:100%;
  height:54px;
  border-radius:16px;
  border:1px solid #dbe4f0;
  padding:0 18px;
  font-size:16px;
  color:#0f172a;
  background:white;
}

input:focus, select:focus{
  outline:none;
  border-color:#2563eb;
  box-shadow:0 0 0 4px rgba(37,99,235,.12);
}

.btn-salvar{
  width:100%;
  height:58px;
  border:none;
  border-radius:18px;
  background:linear-gradient(90deg,#2563eb,#1d4ed8);
  color:white;
  font-size:20px;
  font-weight:800;
  cursor:pointer;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
}

.funcionarios-topo{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:18px;
  margin-bottom:24px;
  flex-wrap:wrap;
}

.funcionarios-topo h2{font-size:30px;margin-bottom:6px}
.funcionarios-topo p{color:#64748b;font-size:15px}

.contador{
  background:#eff6ff;
  color:#2563eb;
  font-size:13px;
  padding:7px 12px;
  border-radius:999px;
  font-weight:700;
  margin-left:8px;
}

.filtros{display:flex;gap:12px;flex-wrap:wrap}

.pesquisa{position:relative}

.pesquisa i{
  position:absolute;
  left:16px;
  top:50%;
  transform:translateY(-50%);
  color:#64748b;
}

.pesquisa input{
  width:260px;
  height:50px;
  padding-left:44px;
  font-size:15px;
}

select{
  height:50px;
  border-radius:16px;
  border:1px solid #dbe4f0;
  padding:0 16px;
  font-size:15px;
  background:white;
  color:#0f172a;
  min-width:150px;
}

.funcionario{
  border:1px solid #e2e8f0;
  border-radius:24px;
  padding:22px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:22px;
  margin-bottom:18px;
}

.dados{
  display:flex;
  align-items:center;
  gap:18px;
  flex:1;
  min-width:260px;
}

.foto{
  width:82px;
  height:82px;
  border-radius:20px;
  object-fit:cover;
  background:#e2e8f0;
  flex-shrink:0;
}

.foto-placeholder{
  width:82px;
  height:82px;
  border-radius:20px;
  background:#f1f5f9;
  display:flex;
  justify-content:center;
  align-items:center;
  color:#cbd5e1;
  font-size:30px;
  flex-shrink:0;
}

.dados strong{font-size:22px;display:block;margin-bottom:6px}

.dados small{
  display:block;
  color:#64748b;
  font-size:15px;
  line-height:1.7;
}

.dados small i{width:22px;color:#475569}

.status{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:8px 14px;
  border-radius:999px;
  font-size:13px;
  font-weight:700;
  margin-top:10px;
}

.ativo{background:#dcfce7;color:#166534}
.inativo{background:#fee2e2;color:#991b1b}

.acoes{
  display:flex;
  gap:10px;
  align-items:center;
  flex-wrap:wrap;
}

.btn-acao{
  height:50px;
  padding:0 18px;
  border-radius:14px;
  border:none;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:8px;
}

.editar{
  background:#fff7ed;
  color:#f59e0b;
  border:1px solid #fdba74;
}

.inativar{
  background:#64748b;
  color:white;
}

.footer-lista{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:18px;
  flex-wrap:wrap;
  gap:18px;
}

.footer-lista p{color:#64748b;font-size:14px}

.vazio{
  color:#64748b;
  font-style:italic;
  padding:14px 0;
}

@media(max-width:1200px){
  .grid{grid-template-columns:1fr 1fr}
}

@media(max-width:900px){
  body{padding:16px}
  .titulo h1{font-size:26px}
  .titulo p{font-size:15px}
  .grid{grid-template-columns:1fr}
  .funcionario{flex-direction:column;align-items:flex-start}
  .acoes{width:100%}
  .btn-acao{flex:1;justify-content:center}
  .card-header h2{font-size:24px}
  .funcionarios-topo h2{font-size:24px}
}
  </style>
</head>

<body>

<div class="container">

  <div class="topo">
    <div class="titulo">
      <h1 id="empresaNome">PontoFácil</h1>
      <p>Painel da gestão da empresa</p>
    </div>

    <div class="botoes-topo">
      <button class="btn-topo" onclick="gerarQRCode()">
        <i class="fa-solid fa-qrcode"></i> QR Code
      </button>

      <button class="btn-topo" onclick="window.location.href='./dashboard.html'">
        <i class="fa-solid fa-chart-column"></i> Dashboard
      </button>

      <button class="btn-topo" onclick="window.location.href='./relatorio.html'">
        <i class="fa-regular fa-calendar"></i> Relatório mensal
      </button>

      <button class="btn-topo" onclick="window.location.href='./banco-horas.html'">
        <i class="fa-regular fa-clock"></i> Banco de horas
      </button>

      <button class="btn-topo btn-sair" onclick="sair()">
        <i class="fa-solid fa-arrow-right-from-bracket"></i> Sair
      </button>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <div class="icone-card">
        <i class="fa-solid fa-user-plus"></i>
      </div>

      <div>
        <h2>Cadastrar funcionário</h2>
        <p>Preencha os dados para cadastrar um novo funcionário.</p>
      </div>
    </div>

    <div class="grid">

      <label class="upload-box">
        <i class="fa-solid fa-cloud-arrow-up"></i>
        <strong>Clique para enviar</strong>
        <span>PNG, JPG até 5MB</span>
        <input id="foto" type="file" accept="image/*" hidden>
      </label>

      <div class="campo">
        <label>Nome completo</label>
        <div class="input-icon">
          <i class="fa-regular fa-user"></i>
          <input id="nome" placeholder="Ex: João da Silva">
        </div>
      </div>

      <div class="campo">
        <label>CPF</label>
        <div class="input-icon">
          <i class="fa-regular fa-id-card"></i>
          <input id="cpf" placeholder="000.000.000-00">
        </div>
      </div>

      <div class="campo">
        <label>Função</label>
        <div class="input-icon">
          <i class="fa-solid fa-briefcase"></i>
          <input id="funcao" placeholder="Ex: Recepcionista">
        </div>
      </div>

      <div class="campo">
        <label>Data de nascimento</label>
        <div class="input-icon">
          <i class="fa-regular fa-calendar"></i>
          <input id="data_nascimento" type="date">
        </div>
      </div>

      <div class="campo">
        <label>Horário de entrada</label>
        <div class="input-icon">
          <i class="fa-regular fa-clock"></i>
          <input id="horario_entrada" type="time">
        </div>
      </div>

      <div class="campo">
        <label>Saída para intervalo</label>
        <div class="input-icon">
          <i class="fa-regular fa-clock"></i>
          <input id="horario_intervalo" type="time">
        </div>
      </div>

      <div class="campo">
        <label>Retorno do intervalo</label>
        <div class="input-icon">
          <i class="fa-regular fa-clock"></i>
          <input id="horario_retorno" type="time">
        </div>
      </div>

      <div class="campo">
        <label>Horário de saída</label>
        <div class="input-icon">
          <i class="fa-regular fa-clock"></i>
          <input id="horario_saida" type="time">
        </div>
      </div>

    </div>

    <button class="btn-salvar" onclick="salvarFuncionario()">
      <i class="fa-regular fa-floppy-disk"></i>
      Salvar funcionário
    </button>
  </div>

  <div class="card">
    <div class="funcionarios-topo">
      <div>
        <h2>
          Funcionários cadastrados
          <span class="contador" id="contadorFuncionarios">0</span>
        </h2>
        <p>Lista de todos os funcionários da empresa.</p>
      </div>

      <div class="filtros">
        <div class="pesquisa">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input id="buscaFuncionario" placeholder="Buscar funcionário..." oninput="renderizarFuncionarios()">
        </div>

        <select id="filtroStatus" onchange="renderizarFuncionarios()">
          <option value="todos">Todos</option>
          <option value="ativos">Ativos</option>
          <option value="inativos">Inativos</option>
        </select>
      </div>
    </div>

    <div id="listaFuncionarios"></div>

    <div class="footer-lista">
      <p id="textoQuantidade">Mostrando 0 funcionários</p>
    </div>
  </div>

</div>

<script>
  const supabaseUrl = "https://ixeeperktitbzmnvcaqz.supabase.co";

  const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml4ZWVwZXJrdGl0YnptbnZjYXF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3Njg1MTEsImV4cCI6MjA5NDM0NDUxMX0.E4nC-w8XRpk_X7vghkGfbXuJUHQneLUJy2DLw9NsuVQ";

  const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

  const empresaId = localStorage.getItem("pontofacil_empresa_id");
  const empresaNome = localStorage.getItem("pontofacil_empresa_nome");

  let funcionarios = [];

  if(!empresaId){
    window.location.href = "./gestao.html";
  }

  document.getElementById("empresaNome").innerText = empresaNome || "PontoFácil";

  function sair(){
    localStorage.removeItem("pontofacil_empresa_logada");
    localStorage.removeItem("pontofacil_empresa_id");
    localStorage.removeItem("pontofacil_empresa_nome");
    localStorage.removeItem("pontofacil_empresa_email");
    window.location.href = "./gestao.html";
  }

  function normalizarNomeArquivo(texto){
    return String(texto || "")
      .toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/^-+|-+$/g, "");
  }

  async function enviarFotoFuncionario(nomeFuncionario){
    const inputFoto = document.getElementById("foto");

    if(!inputFoto.files || inputFoto.files.length === 0){
      return "";
    }

    const arquivo = inputFoto.files[0];
    const extensao = arquivo.name.split(".").pop().toLowerCase();
    const nomeArquivo = `${empresaId}/${normalizarNomeArquivo(nomeFuncionario)}-${Date.now()}.${extensao}`;

    const { error: uploadError } = await supabaseClient
      .storage
      .from("funcionarios")
      .upload(nomeArquivo, arquivo, {
        cacheControl: "3600",
        upsert: false
      });

    if(uploadError){
      console.log("Erro ao enviar foto:", uploadError);
      alert("Erro ao enviar foto do funcionário.");
      return null;
    }

    const { data: urlData } = supabaseClient
      .storage
      .from("funcionarios")
      .getPublicUrl(nomeArquivo);

    return urlData.publicUrl;
  }

  async function salvarFuncionario(){
    const nome = document.getElementById("nome").value.trim();
    const cpf = document.getElementById("cpf").value.trim();
    const funcao = document.getElementById("funcao").value.trim();
    const data_nascimento = document.getElementById("data_nascimento").value;
    const horario_entrada = document.getElementById("horario_entrada").value;
    const horario_intervalo = document.getElementById("horario_intervalo").value;
    const horario_retorno = document.getElementById("horario_retorno").value;
    const horario_saida = document.getElementById("horario_saida").value;

    if(!nome){
      alert("Informe o nome do funcionário.");
      return;
    }

    const fotoUrl = await enviarFotoFuncionario(nome);

    if(fotoUrl === null){
      return;
    }

    const { error } = await supabaseClient
      .from("funcionarios")
      .insert([
        {
          empresa_id: empresaId,
          nome_completo: nome,
          cpf,
          funcao,
          data_nascimento: data_nascimento || null,
          foto_url: fotoUrl || "",
          horario_entrada: horario_entrada || null,
          horario_intervalo: horario_intervalo || null,
          horario_retorno: horario_retorno || null,
          horario_saida: horario_saida || null,
          ativo: true
        }
      ]);

    if(error){
      console.log(error);
      alert("Erro ao salvar funcionário.");
      return;
    }

    alert("Funcionário cadastrado.");

    document.getElementById("foto").value = "";
    document.getElementById("nome").value = "";
    document.getElementById("cpf").value = "";
    document.getElementById("funcao").value = "";
    document.getElementById("data_nascimento").value = "";
    document.getElementById("horario_entrada").value = "";
    document.getElementById("horario_intervalo").value = "";
    document.getElementById("horario_retorno").value = "";
    document.getElementById("horario_saida").value = "";

    carregarFuncionarios();
  }

  async function carregarFuncionarios(){
    const { data, error } = await supabaseClient
      .from("funcionarios")
      .select("*")
      .eq("empresa_id", empresaId)
      .order("nome_completo");

    if(error){
      console.log(error);
      document.getElementById("listaFuncionarios").innerHTML =
        `<div class="vazio">Erro ao carregar funcionários.</div>`;
      return;
    }

    funcionarios = data || [];
    renderizarFuncionarios();
  }

  function renderizarFuncionarios(){
    const lista = document.getElementById("listaFuncionarios");
    const busca = document.getElementById("buscaFuncionario").value.toLowerCase().trim();
    const status = document.getElementById("filtroStatus").value;

    let filtrados = funcionarios;

    if(status === "ativos"){
      filtrados = filtrados.filter(f => f.ativo === true);
    }

    if(status === "inativos"){
      filtrados = filtrados.filter(f => f.ativo === false);
    }

    if(busca){
      filtrados = filtrados.filter(f =>
        String(f.nome_completo || "").toLowerCase().includes(busca) ||
        String(f.cpf || "").toLowerCase().includes(busca) ||
        String(f.funcao || "").toLowerCase().includes(busca)
      );
    }

    document.getElementById("contadorFuncionarios").textContent = filtrados.length;
    document.getElementById("textoQuantidade").textContent =
      `Mostrando ${filtrados.length} de ${funcionarios.length} funcionários`;

    if(filtrados.length === 0){
      lista.innerHTML = `<div class="vazio">Nenhum funcionário encontrado.</div>`;
      return;
    }

    lista.innerHTML = filtrados.map(funcionario => `
      <div class="funcionario">
        <div class="dados">
          ${
            funcionario.foto_url
            ? `<img class="foto" src="${funcionario.foto_url}" onerror="this.outerHTML='<div class=&quot;foto-placeholder&quot;><i class=&quot;fa-solid fa-user&quot;></i></div>'">`
            : `<div class="foto-placeholder"><i class="fa-solid fa-user"></i></div>`
          }

          <div>
            <strong>${funcionario.nome_completo}</strong>

            <small><i class="fa-regular fa-id-card"></i> CPF: ${funcionario.cpf || "-"}</small>
            <small><i class="fa-solid fa-briefcase"></i> Função: ${funcionario.funcao || "-"}</small>
            <small><i class="fa-regular fa-clock"></i> Horários: ${funcionario.horario_entrada || "--:--"} / ${funcionario.horario_intervalo || "--:--"} / ${funcionario.horario_retorno || "--:--"} / ${funcionario.horario_saida || "--:--"}</small>

            <span class="status ${funcionario.ativo ? "ativo" : "inativo"}">
              ● ${funcionario.ativo ? "ATIVO" : "INATIVO"}
            </span>
          </div>
        </div>

        <div class="acoes">
          <button
            class="btn-acao editar"
            onclick="editarFuncionario(
              '${funcionario.id}',
              '${escapeTexto(funcionario.nome_completo)}',
              '${escapeTexto(funcionario.cpf)}',
              '${escapeTexto(funcionario.funcao)}'
            )"
          >
            <i class="fa-solid fa-pen"></i>
            Editar
          </button>

          <button
            class="btn-acao inativar"
            onclick="alterarStatusFuncionario('${funcionario.id}', ${funcionario.ativo})"
          >
            <i class="fa-solid ${funcionario.ativo ? "fa-pause" : "fa-play"}"></i>
            ${funcionario.ativo ? "Inativar" : "Ativar"}
          </button>
        </div>
      </div>
    `).join("");
  }

  function escapeTexto(texto){
    return String(texto || "")
      .replace(/\\/g, "\\\\")
      .replace(/'/g, "\\'")
      .replace(/"/g, "&quot;");
  }

  async function editarFuncionario(id, nomeAtual, cpfAtual, funcaoAtual){
    const novoNome = prompt("Nome:", nomeAtual);
    if(novoNome === null) return;

    const novoCpf = prompt("CPF:", cpfAtual);
    if(novoCpf === null) return;

    const novaFuncao = prompt("Função:", funcaoAtual);
    if(novaFuncao === null) return;

    const { error } = await supabaseClient
      .from("funcionarios")
      .update({
        nome_completo: novoNome.trim(),
        cpf: novoCpf.trim(),
        funcao: novaFuncao.trim()
      })
      .eq("id", id);

    if(error){
      console.log(error);
      alert("Erro ao editar funcionário.");
      return;
    }

    carregarFuncionarios();
  }

  async function alterarStatusFuncionario(id, statusAtual){
    const confirmar = confirm(
      statusAtual
        ? "Deseja inativar este funcionário?"
        : "Deseja ativar este funcionário?"
    );

    if(!confirmar) return;

    const { error } = await supabaseClient
      .from("funcionarios")
      .update({
        ativo: !statusAtual
      })
      .eq("id", id);

    if(error){
      console.log(error);
      alert("Erro ao alterar status.");
      return;
    }

    carregarFuncionarios();
  }

  async function gerarQRCode(){
    const link = `https://osmarjunior14.github.io/pontofacil/ponto.html?empresa=${empresaId}`;

    const dataUrl = await QRCode.toDataURL(link, {
      width: 320,
      margin: 2
    });

    const janela = window.open("");

    janela.document.write(`
      <html>
        <head>
          <title>QR Code do Ponto</title>
          <style>
            body{
              font-family:Arial;
              display:flex;
              flex-direction:column;
              justify-content:center;
              align-items:center;
              padding:30px;
              text-align:center;
            }

            h1{
              color:#2563eb;
              margin-bottom:20px;
            }

            img{
              width:320px;
              height:320px;
            }

            p{
              margin-top:16px;
              color:#475569;
              max-width:400px;
            }

            button{
              margin-top:20px;
              border:none;
              background:#2563eb;
              color:white;
              padding:12px 18px;
              border-radius:12px;
              font-weight:bold;
              cursor:pointer;
            }
          </style>
        </head>

        <body>
          <h1>${empresaNome || "PontoFácil"}</h1>
          <img src="${dataUrl}" alt="QR Code do ponto">
          <p>Escaneie este QR Code para registrar o ponto.</p>
          <button onclick="window.print()">Imprimir QR Code</button>
        </body>
      </html>
    `);

    janela.document.close();
  }

  carregarFuncionarios();
</script>

</body>
