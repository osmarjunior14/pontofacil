<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PontoFácil - Gestão</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

  <style>
    *{ box-sizing:border-box; margin:0; padding:0; }

    body{
      font-family:Arial, sans-serif;
      background:#f4f7fb;
      color:#0f172a;
      padding:24px;
    }

    .container{ max-width:1300px; margin:auto; }

    .topo{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:26px;
      gap:16px;
      flex-wrap:wrap;
    }

    h1{ color:#2563eb; font-size:34px; }
    .sub{ color:#64748b; margin-top:4px; }

    .botoes-topo{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .btn-topo{
      background:#2563eb;
      color:white;
      border:none;
      border-radius:12px;
      padding:12px 16px;
      font-weight:bold;
      cursor:pointer;
    }

    .btn-sair{
      background:#ef4444;
      color:white;
      border:none;
      border-radius:12px;
      padding:12px 16px;
      font-weight:bold;
      cursor:pointer;
    }

    .card{
      background:white;
      border-radius:22px;
      padding:22px;
      box-shadow:0 12px 35px rgba(15,23,42,.08);
      margin-bottom:24px;
    }

    h2{ margin-bottom:18px; font-size:24px; }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:14px;
    }

    label{
      display:block;
      margin-bottom:6px;
      color:#334155;
      font-size:14px;
      font-weight:700;
    }

    input{
      width:100%;
      padding:14px;
      border-radius:12px;
      border:1px solid #dbe4f0;
      font-size:15px;
      background:white;
    }

    input:focus{
      outline:none;
      border-color:#2563eb;
      box-shadow:0 0 0 4px rgba(37,99,235,.12);
    }

    .btn{
      margin-top:14px;
      width:100%;
      padding:14px;
      border:none;
      border-radius:12px;
      background:#2563eb;
      color:white;
      font-weight:bold;
      cursor:pointer;
      font-size:15px;
    }

    .funcionario{
      border:1px solid #e2e8f0;
      border-radius:18px;
      padding:16px;
      margin-bottom:14px;
      display:flex;
      justify-content:space-between;
      gap:18px;
      flex-wrap:wrap;
      align-items:center;
    }

    .dados-funcionario{
      display:flex;
      align-items:center;
      gap:14px;
      flex:1;
      min-width:260px;
    }

    .foto-funcionario{
      width:74px;
      height:74px;
      border-radius:14px;
      object-fit:cover;
      background:#e2e8f0;
      border:1px solid #dbe4f0;
      flex-shrink:0;
    }

    .funcionario strong{
      display:block;
      font-size:18px;
      margin-bottom:6px;
    }

    .funcionario small{
      display:block;
      color:#64748b;
      line-height:1.6;
    }

    .status{
      display:inline-block;
      margin-top:8px;
      padding:5px 10px;
      border-radius:999px;
      font-size:12px;
      font-weight:bold;
    }

    .ativo{ background:#dcfce7; color:#166534; }
    .inativo{ background:#fee2e2; color:#991b1b; }

    .acoes{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }

    .acoes button{
      border:none;
      border-radius:10px;
      padding:10px 12px;
      font-weight:bold;
      color:white;
      cursor:pointer;
    }

    .editar{ background:#f59e0b; }
    .inativar{ background:#64748b; }

    .vazio{
      color:#64748b;
      font-style:italic;
    }

    @media(max-width:700px){
      body{ padding:16px; }

      .funcionario{
        align-items:flex-start;
      }

      .acoes{
        width:100%;
      }

      .acoes button{
        flex:1;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="topo">
    <div>
      <h1 id="empresaNome">PontoFácil</h1>
      <div class="sub">Painel da gestão da empresa</div>
    </div>

    <div class="botoes-topo">

  <button class="btn-topo" onclick="gerarQRCode()">

    QR Code

  </button>

  <button class="btn-topo" onclick="window.location.href='./dashboard.html'">

    Dashboard

  </button>

  <button class="btn-topo" onclick="window.location.href='./relatorio.html'">

    Relatório mensal

  </button>

  <button class="btn-topo" onclick="window.location.href='./banco-horas.html'">

    Banco de horas

  </button>

  <button class="btn-sair" onclick="sair()">

    Sair

  </button>

</div>
</div>
  <div class="card">
    <h2>Cadastrar funcionário</h2>

    <div class="grid">
      <div>
        <label>Foto do funcionário</label>
        <input id="foto" type="file" accept="image/*">
      </div>

      <div>
        <label>Nome completo</label>
        <input id="nome" placeholder="Ex: João da Silva">
      </div>

      <div>
        <label>CPF</label>
        <input id="cpf" placeholder="000.000.000-00">
      </div>

      <div>
        <label>Função</label>
        <input id="funcao" placeholder="Ex: Recepcionista">
      </div>

      <div>
        <label>Data de nascimento</label>
        <input id="data_nascimento" type="date">
      </div>

      <div>
        <label>Horário de entrada</label>
        <input id="horario_entrada" type="time">
      </div>

      <div>
        <label>Saída para intervalo</label>
        <input id="horario_intervalo" type="time">
      </div>

      <div>
        <label>Retorno do intervalo</label>
        <input id="horario_retorno" type="time">
      </div>

      <div>
        <label>Horário de saída</label>
        <input id="horario_saida" type="time">
      </div>
    </div>

    <button class="btn" onclick="salvarFuncionario()">Salvar funcionário</button>
  </div>

  <div class="card">
    <h2>Funcionários cadastrados</h2>
    <div id="listaFuncionarios"></div>
  </div>

</div>

<script>
  const supabaseUrl = "https://ixeeperktitbzmnvcaqz.supabase.co";

  const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml4ZWVwZXJrdGl0YnptbnZjYXF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3Njg1MTEsImV4cCI6MjA5NDM0NDUxMX0.E4nC-w8XRpk_X7vghkGfbXuJUHQneLUJy2DLw9NsuVQ";

  const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

  const empresaId = localStorage.getItem("pontofacil_empresa_id");
  const empresaNome = localStorage.getItem("pontofacil_empresa_nome");

  if(!empresaId){
    window.location.href = "./gestao.html";
  }

  document.getElementById("empresaNome").innerText = empresaNome || "PontoFácil";

  function sair(){
    localStorage.removeItem("pontofacil_empresa_logada");
    localStorage.removeItem("pontofacil_empresa_id");
    localStorage.removeItem("pontofacil_empresa_nome");
    localStorage.removeItem("pontofacil_empresa_email");

    window.location.href = "./gestao.html";
  }

  function normalizarNomeArquivo(texto){
    return String(texto || "")
      .toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/^-+|-+$/g, "");
  }

  async function enviarFotoFuncionario(nomeFuncionario){
    const inputFoto = document.getElementById("foto");

    if(!inputFoto.files || inputFoto.files.length === 0){
      return "";
    }

    const arquivo = inputFoto.files[0];
    const extensao = arquivo.name.split(".").pop().toLowerCase();
    const nomeArquivo = `${empresaId}/${normalizarNomeArquivo(nomeFuncionario)}-${Date.now()}.${extensao}`;

    const { error: uploadError } = await supabaseClient
      .storage
      .from("funcionarios")
      .upload(nomeArquivo, arquivo, {
        cacheControl: "3600",
        upsert: false
      });

    if(uploadError){
      console.log("Erro ao enviar foto:", uploadError);
      alert("Erro ao enviar foto do funcionário.");
      return null;
    }

    const { data: urlData } = supabaseClient
      .storage
      .from("funcionarios")
      .getPublicUrl(nomeArquivo);

    return urlData.publicUrl;
  }

  async function salvarFuncionario(){
    const nome = document.getElementById("nome").value.trim();
    const cpf = document.getElementById("cpf").value.trim();
    const funcao = document.getElementById("funcao").value.trim();
    const data_nascimento = document.getElementById("data_nascimento").value;
    const horario_entrada = document.getElementById("horario_entrada").value;
    const horario_intervalo = document.getElementById("horario_intervalo").value;
    const horario_retorno = document.getElementById("horario_retorno").value;
    const horario_saida = document.getElementById("horario_saida").value;

    if(!nome){
      alert("Informe o nome do funcionário.");
      return;
    }

    const fotoUrl = await enviarFotoFuncionario(nome);

    if(fotoUrl === null){
      return;
    }

    const { error } = await supabaseClient
      .from("funcionarios")
      .insert([
        {
          empresa_id: empresaId,
          nome_completo: nome,
          cpf,
          funcao,
          data_nascimento: data_nascimento || null,
          foto_url: fotoUrl || "",
          horario_entrada: horario_entrada || null,
          horario_intervalo: horario_intervalo || null,
          horario_retorno: horario_retorno || null,
          horario_saida: horario_saida || null,
          ativo: true
        }
      ]);

    if(error){
      console.log(error);
      alert("Erro ao salvar funcionário.");
      return;
    }

    alert("Funcionário cadastrado.");

    document.getElementById("foto").value = "";
    document.getElementById("nome").value = "";
    document.getElementById("cpf").value = "";
    document.getElementById("funcao").value = "";
    document.getElementById("data_nascimento").value = "";
    document.getElementById("horario_entrada").value = "";
    document.getElementById("horario_intervalo").value = "";
    document.getElementById("horario_retorno").value = "";
    document.getElementById("horario_saida").value = "";

    carregarFuncionarios();
  }

  async function carregarFuncionarios(){
    const { data, error } = await supabaseClient
      .from("funcionarios")
      .select("*")
      .eq("empresa_id", empresaId)
      .order("nome_completo");

    const lista = document.getElementById("listaFuncionarios");

    if(error){
      console.log(error);
      lista.innerHTML = `<div class="vazio">Erro ao carregar funcionários.</div>`;
      return;
    }

    if(!data || data.length === 0){
      lista.innerHTML = `<div class="vazio">Nenhum funcionário cadastrado.</div>`;
      return;
    }

    lista.innerHTML = data.map(funcionario => `
      <div class="funcionario">
        <div class="dados-funcionario">
          <img
            class="foto-funcionario"
            src="${funcionario.foto_url || ""}"
            onerror="this.style.display='none'"
          >

          <div>
            <strong>${funcionario.nome_completo}</strong>
            <small><b>CPF:</b> ${funcionario.cpf || "-"}</small>
            <small><b>Função:</b> ${funcionario.funcao || "-"}</small>
            <small>
              <b>Horários:</b>
              ${funcionario.horario_entrada || "--:--"} /
              ${funcionario.horario_intervalo || "--:--"} /
              ${funcionario.horario_retorno || "--:--"} /
              ${funcionario.horario_saida || "--:--"}
            </small>

            <span class="status ${funcionario.ativo ? "ativo" : "inativo"}">
              ${funcionario.ativo ? "ATIVO" : "INATIVO"}
            </span>
          </div>
        </div>

        <div class="acoes">
          <button
            class="editar"
            onclick="editarFuncionario(
              '${funcionario.id}',
              '${escapeTexto(funcionario.nome_completo)}',
              '${escapeTexto(funcionario.cpf)}',
              '${escapeTexto(funcionario.funcao)}'
            )"
          >
            Editar
          </button>

          <button
            class="inativar"
            onclick="alterarStatusFuncionario('${funcionario.id}', ${funcionario.ativo})"
          >
            ${funcionario.ativo ? "Inativar" : "Ativar"}
          </button>
        </div>
      </div>
    `).join("");
  }

  function escapeTexto(texto){
    return String(texto || "")
      .replace(/\\/g, "\\\\")
      .replace(/'/g, "\\'")
      .replace(/"/g, "&quot;");
  }

  async function editarFuncionario(id, nomeAtual, cpfAtual, funcaoAtual){
    const novoNome = prompt("Nome:", nomeAtual);
    if(novoNome === null) return;

    const novoCpf = prompt("CPF:", cpfAtual);
    if(novoCpf === null) return;

    const novaFuncao = prompt("Função:", funcaoAtual);
    if(novaFuncao === null) return;

    const { error } = await supabaseClient
      .from("funcionarios")
      .update({
        nome_completo: novoNome.trim(),
        cpf: novoCpf.trim(),
        funcao: novaFuncao.trim()
      })
      .eq("id", id);

    if(error){
      console.log(error);
      alert("Erro ao editar funcionário.");
      return;
    }

    carregarFuncionarios();
  }

  async function alterarStatusFuncionario(id, statusAtual){
    const confirmar = confirm(
      statusAtual
        ? "Deseja inativar este funcionário?"
        : "Deseja ativar este funcionário?"
    );

    if(!confirmar) return;

    const { error } = await supabaseClient
      .from("funcionarios")
      .update({
        ativo: !statusAtual
      })
      .eq("id", id);

    if(error){
      console.log(error);
      alert("Erro ao alterar status.");
      return;
    }

    carregarFuncionarios();
  }

  async function gerarQRCode(){
  const link = `https://osmarjunior14.github.io/pontofacil/ponto.html?empresa=${empresaId}`;

  const dataUrl = await QRCode.toDataURL(link, {
    width: 320,
    margin: 2
  });

  const janela = window.open("");

  janela.document.write(`
    <html>
      <head>
        <title>QR Code do Ponto</title>
        <style>
          body{
            font-family:Arial;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            padding:30px;
            text-align:center;
          }

          h1{
            color:#2563eb;
            margin-bottom:20px;
          }

          img{
            width:320px;
            height:320px;
          }

          p{
            margin-top:16px;
            color:#475569;
            max-width:400px;
          }

          button{
            margin-top:20px;
            border:none;
            background:#2563eb;
            color:white;
            padding:12px 18px;
            border-radius:12px;
            font-weight:bold;
            cursor:pointer;
          }
        </style>
      </head>

      <body>
        <h1>${empresaNome || "PontoFácil"}</h1>

        <img src="${dataUrl}" alt="QR Code do ponto">

        <p>Escaneie este QR Code para registrar o ponto.</p>

        <button onclick="window.print()">Imprimir QR Code</button>
      </body>
    </html>
  `);

  janela.document.close();
}

  carregarFuncionarios();
</script>

</body>
</html>
