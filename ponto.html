  <style>

<body>

<div class="app">

  <div class="hero">

    <p>Registro eletrônico de ponto</p>

  <div class="content">

    <div class="clock-card">

    <div class="campo">
      <label>

      <label>

        <div class="camera-area">

</div>

<script>
  const supabaseUrl = "https://ixeeperktitbzmnvcaqz.supabase.co";

  const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml4ZWVwZXJrdGl0YnptbnZjYXF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3Njg1MTEsImV4cCI6MjA5NDM0NDUxMX0.E4nC-w8XRpk_X7vghkGfbXuJUHQneLUJy2DLw9NsuVQ";

  const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

  const params = new URLSearchParams(window.location.search);
  const empresaId = params.get("empresa");

  let funcionarios = [];
  let empresaDados = null;
  const nomesTipos = {
  entrada: "Entrada",
  saida_intervalo: "Saída para intervalo",
  retorno_intervalo: "Retorno do intervalo",
  saida: "Saída"
};
  
  let streamCamera = null;
  let fotoCapturadaBlob = null;

  function atualizarRelogio(){
    const agora = new Date();

    document.getElementById("horaAtual").innerText =
      agora.toLocaleTimeString("pt-BR", {
        hour:"2-digit",
        minute:"2-digit"
      });

    document.getElementById("dataAtual").innerText =
      agora.toLocaleDateString("pt-BR", {
        weekday:"long",
        day:"2-digit",
        month:"long",
        year:"numeric"
      });
  }

  setInterval(atualizarRelogio, 1000);
  atualizarRelogio();

  document.getElementById("observacao").addEventListener("input", function(){
    document.getElementById("contadorObs").innerText = this.value.length;
  });

  function normalizarNomeArquivo(texto){
    return String(texto || "")
      .toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/^-+|-+$/g, "");
  }

  function mostrarMensagem(tipo, texto){
    document.getElementById("mensagem").innerHTML =
      `<div class="${tipo}">${texto}</div>`;
  }

async function obterProximoTipoPermitido(funcionarioId){
  const hoje = new Date();

  const inicioHoje = new Date(
    hoje.getFullYear(),
    hoje.getMonth(),
    hoje.getDate()
  ).toISOString();

  const amanha = new Date(
    hoje.getFullYear(),
    hoje.getMonth(),
    hoje.getDate() + 1
  ).toISOString();

  const { data, error } = await supabaseClient
    .from("registros_ponto")
    .select("tipo, data_hora")
    .eq("empresa_id", empresaId)
    .eq("funcionario_id", funcionarioId)
    .gte("data_hora", inicioHoje)
    .lt("data_hora", amanha)
    .order("data_hora", { ascending:true });

  if(error){
    console.log("Erro ao buscar registros do dia:", error);
    return null;
  }

  const funcionario = funcionarios.find(
    f => String(f.id) === String(funcionarioId)
  );

  const tiposHoje = (data || []).map(registro => registro.tipo);

  if(funcionario?.sem_intervalo === true){
    if(!tiposHoje.includes("entrada")) return "entrada";
    if(!tiposHoje.includes("saida")) return "saida";
    return "finalizado";
  }

  if(!tiposHoje.includes("entrada")) return "entrada";
  if(!tiposHoje.includes("saida_intervalo")) return "saida_intervalo";
  if(!tiposHoje.includes("retorno_intervalo")) return "retorno_intervalo";
  if(!tiposHoje.includes("saida")) return "saida";

  return "finalizado";
}
  async function validarIntervaloMinimo(funcionarioId){
  const agora = new Date();
  const cincoMinAtras = new Date(agora.getTime() - (60 * 1000));

  const { data, error } = await supabaseClient
    .from("registros_ponto")
    .select("*")
    .eq("empresa_id", empresaId)
    .eq("funcionario_id", funcionarioId)
    .gte("data_hora", cincoMinAtras.toISOString())
    .order("data_hora", { ascending:false })
    .limit(1);

  if(error){
    console.log("Erro ao validar intervalo mínimo:", error);
    return {
      permitido:false,
      motivo:"Erro ao validar intervalo."
    };
  }

  if(data && data.length > 0){
    const ultimoRegistro = new Date(data[0].data_hora);
    const diferencaSegundos = Math.floor(
      (agora.getTime() - ultimoRegistro.getTime()) / 1000
    );

    return {
      permitido:false,
      motivo:`Aguarde ${60 - diferencaSegundos}s para registrar novamente.`
    };
  }

  return {
    permitido:true
  };
}
  
  async function abrirCamera(){
    const video = document.getElementById("cameraVideo");
    const foto = document.getElementById("fotoCapturada");
    const placeholder = document.getElementById("cameraPlaceholder");
    const status = document.getElementById("cameraStatus");

    try{
      if(streamCamera){
        streamCamera.getTracks().forEach(track => track.stop());
      }

      streamCamera = await navigator.mediaDevices.getUserMedia({
        video:{
          facingMode:"user",
          width:{ ideal:720 },
          height:{ ideal:720 }
        },
        audio:false
      });

      video.srcObject = streamCamera;
      video.style.display = "block";
      foto.style.display = "none";
      placeholder.style.display = "none";

      fotoCapturadaBlob = null;
      status.innerText = "Câmera ao vivo aberta. Agora capture a foto.";

    }catch(error){
      console.log("Erro ao abrir câmera:", error);
      mostrarMensagem("erro", "Não foi possível abrir a câmera. Permita o acesso à câmera e tente novamente.");
    }
  }

  function capturarFotoAoVivo(){
    const video = document.getElementById("cameraVideo");
    const canvas = document.getElementById("canvasFoto");
    const foto = document.getElementById("fotoCapturada");
    const status = document.getElementById("cameraStatus");

    if(!streamCamera || !video.videoWidth){
      mostrarMensagem("erro", "Abra a câmera antes de capturar a foto.");
      return;
    }

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    const ctx = canvas.getContext("2d");
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    canvas.toBlob(blob => {
      if(!blob){
        mostrarMensagem("erro", "Erro ao capturar a foto.");
        return;
      }

      fotoCapturadaBlob = blob;

      const urlPreview = URL.createObjectURL(blob);
      foto.src = urlPreview;
      foto.style.display = "block";
      video.style.display = "none";

      status.innerText = "Foto capturada ao vivo com sucesso.";

      if(streamCamera){
        streamCamera.getTracks().forEach(track => track.stop());
        streamCamera = null;
      }
    }, "image/jpeg", 0.9);
  }

  async function carregarEmpresa(){
    if(!empresaId) return;

    const { data, error } = await supabaseClient
      .from("empresas")
      .select("id, nome, latitude, longitude, raio_permitido_metros")
      .eq("id", empresaId)
      .single();

    if(error){
      console.log("Erro ao carregar empresa:", error);
      mostrarMensagem("erro", "Erro ao carregar dados da empresa.");
      return;
    }

    empresaDados = data;
  }

  function calcularDistanciaMetros(lat1, lon1, lat2, lon2){
    const R = 6371000;
    const rad = Math.PI / 180;
    const dLat = (lat2 - lat1) * rad;
    const dLon = (lon2 - lon1) * rad;

    const a =
      Math.sin(dLat / 2) * Math.sin(dLat / 2) +
      Math.cos(lat1 * rad) *
      Math.cos(lat2 * rad) *
      Math.sin(dLon / 2) *
      Math.sin(dLon / 2);

    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

    return R * c;
  }

  function obterLocalizacaoAtual(){
    return new Promise((resolve, reject) => {
      if(!navigator.geolocation){
        reject("Geolocalização não suportada neste aparelho.");
        return;
      }

      navigator.geolocation.getCurrentPosition(
        posicao => {
          resolve({
            latitude: posicao.coords.latitude,
            longitude: posicao.coords.longitude,
            precisao: posicao.coords.accuracy
          });
        },
        erro => {
          console.log("Erro GPS:", erro);
          reject("Não foi possível obter sua localização. Ative o GPS e permita o acesso à localização.");
        },
        {
          enableHighAccuracy:true,
          timeout:15000,
          maximumAge:0
        }
      );
    });
  }

  async function validarLocalizacao(){
    if(!empresaDados){
      mostrarMensagem("erro", "Dados da empresa não carregados.");
      return null;
    }

    if(!empresaDados.latitude || !empresaDados.longitude){
      mostrarMensagem("erro", "Esta empresa ainda não possui localização GPS cadastrada.");
      return null;
    }

    try{
      const localizacao = await obterLocalizacaoAtual();

      const distancia = calcularDistanciaMetros(
        Number(empresaDados.latitude),
        Number(empresaDados.longitude),
        Number(localizacao.latitude),
        Number(localizacao.longitude)
      );

      const raioPermitido = Number(empresaDados.raio_permitido_metros || 50);

      if(distancia > raioPermitido){
        mostrarMensagem(
          "erro",
          `Registro bloqueado. Você está a aproximadamente ${Math.round(distancia)}m da empresa. Limite permitido: ${raioPermitido}m.`
        );

        return null;
      }

      return {
        latitude:localizacao.latitude,
        longitude:localizacao.longitude,
        distancia_metros:Math.round(distancia)
      };

    }catch(erro){
      mostrarMensagem("erro", erro);
      return null;
    }
  }

  async function carregarFuncionarios(){
    const select = document.getElementById("funcionario");

    if(!empresaId){
      select.innerHTML = `<option value="">Empresa não identificada</option>`;
      mostrarMensagem("erro", "QR Code inválido. Empresa não identificada.");
      return;
    }

    const { data, error } = await supabaseClient
      .from("funcionarios")
      .select("*")
      .eq("empresa_id", empresaId)
      .eq("ativo", true)
      .order("nome_completo");

    if(error){
      console.log(error);
      select.innerHTML = `<option value="">Erro ao carregar</option>`;
      mostrarMensagem("erro", "Erro ao carregar funcionários.");
      return;
    }

    funcionarios = data || [];

    if(funcionarios.length === 0){
      select.innerHTML = `<option value="">Nenhum funcionário ativo</option>`;
      return;
    }

    select.innerHTML = `
      <option value="">Selecione seu nome</option>
      ${funcionarios.map(funcionario => `
        <option value="${funcionario.id}">
          ${funcionario.nome_completo}
        </option>
      `).join("")}
    `;
  }

function mostrarFuncionario(){
  const funcionarioId = document.getElementById("funcionario").value;
  const funcionario = funcionarios.find(f => String(f.id) === String(funcionarioId));
  const preview = document.getElementById("previewFuncionario");
  const foto = document.getElementById("fotoFuncionario");
  const avatarFallback = document.getElementById("avatarFallback");

  if(!funcionario){
    preview.style.display = "none";
    return;
  }

  avatarFallback.style.display = "none";
  foto.style.display = "block";
  foto.src = funcionario.foto_url || "";

  if(!funcionario.foto_url){
    foto.style.display = "none";
    avatarFallback.style.display = "flex";
  }

  document.getElementById("nomeFuncionarioPreview").innerText = funcionario.nome_completo;
  document.getElementById("funcaoFuncionarioPreview").innerText = funcionario.funcao || "Funcionário";

  preview.style.display = "flex";

  atualizarTipoAutomatico(funcionarioId);
}

async function atualizarTipoAutomatico(funcionarioId){
  const selectTipo = document.getElementById("tipo");
  const botao = document.getElementById("btnRegistrar");

  selectTipo.innerHTML = `<option value="">Verificando próximo registro...</option>`;
  selectTipo.disabled = true;
  botao.disabled = true;

  const proximoTipo = await obterProximoTipoPermitido(funcionarioId);

  if(proximoTipo === "finalizado"){
    selectTipo.innerHTML = `<option value="">Ponto de hoje finalizado</option>`;
    mostrarMensagem("sucesso", "✅ Todos os registros de ponto de hoje já foram concluídos.");
    return;
  }

  if(proximoTipo === null){
    selectTipo.innerHTML = `<option value="">Erro ao validar sequência</option>`;
    mostrarMensagem("erro", "Não foi possível validar a sequência do ponto.");
    return;
  }

  selectTipo.innerHTML = `
    <option value="${proximoTipo}">
      ${nomesTipos[proximoTipo]}
    </option>
  `;

  selectTipo.value = proximoTipo;
  selectTipo.disabled = true;
  botao.disabled = false;
}

  async function enviarFotoPonto(funcionarioId, tipo){
    if(!fotoCapturadaBlob){
      return null;
    }

    const nomeArquivo = `${empresaId}/${funcionarioId}/${tipo}-${Date.now()}-camera-ao-vivo.jpg`;

    const { error: uploadError } = await supabaseClient
      .storage
      .from("pontos")
      .upload(nomeArquivo, fotoCapturadaBlob, {
        cacheControl:"3600",
        upsert:false,
        contentType:"image/jpeg"
      });

    if(uploadError){
      console.log("Erro upload foto ponto:", uploadError);
      return null;
    }

    const { data: urlData } = supabaseClient
      .storage
      .from("pontos")
      .getPublicUrl(nomeArquivo);

    return urlData.publicUrl;
  }

  async function registrarPonto(){
    const funcionarioId = document.getElementById("funcionario").value;
    const tipo = document.getElementById("tipo").value;
    const observacao = document.getElementById("observacao").value.trim();
    const botao = document.getElementById("btnRegistrar");

    document.getElementById("mensagem").innerHTML = "";

    if(!funcionarioId){
      mostrarMensagem("erro", "Selecione o funcionário.");
      return;
    }

    if(!tipo){
      mostrarMensagem("erro", "Selecione o tipo de registro.");
      return;
    }
    
const proximoTipoPermitido = await obterProximoTipoPermitido(funcionarioId);

if(proximoTipoPermitido === "finalizado"){
  mostrarMensagem("erro", "Você já concluiu todos os registros de ponto de hoje.");
  return;
}

if(proximoTipoPermitido === null){
  mostrarMensagem("erro", "Não foi possível validar a sequência do ponto.");
  return;
}

if(tipo !== proximoTipoPermitido){
  mostrarMensagem(
    "erro",
    `Registro inválido. O próximo registro permitido é: ${nomesTipos[proximoTipoPermitido]}.`
  );

  return;
}

const validacaoTempo = await validarIntervaloMinimo(funcionarioId);

if(!validacaoTempo.permitido){
  mostrarMensagem("erro", validacaoTempo.motivo);
  return;
}
    
    if(!fotoCapturadaBlob){
      mostrarMensagem("erro", "Capture uma foto ao vivo para registrar o ponto.");
      return;
    }

    botao.disabled = true;
    botao.innerHTML = `<i class="fa-solid fa-location-dot"></i> Verificando localização...`;

    const localizacaoValidada = await validarLocalizacao();

    if(!localizacaoValidada){
      botao.disabled = false;
      botao.innerHTML = `<i class="fa-regular fa-floppy-disk"></i> Registrar ponto`;
      return;
    }

    botao.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Registrando...`;

    const fotoUrl = await enviarFotoPonto(funcionarioId, tipo);

    if(!fotoUrl){
      mostrarMensagem("erro", "Erro ao enviar foto do ponto.");
      botao.disabled = false;
      botao.innerHTML = `<i class="fa-regular fa-floppy-disk"></i> Registrar ponto`;
      return;
    }

    const { error } = await supabaseClient
      .from("registros_ponto")
      .insert([
        {
          empresa_id:empresaId,
          funcionario_id:funcionarioId,
          tipo,
          observacao,
          foto_url:fotoUrl,
          data_hora:new Date().toISOString(),
          latitude:localizacaoValidada.latitude,
          longitude:localizacaoValidada.longitude,
          distancia_metros:localizacaoValidada.distancia_metros,
          captura_ao_vivo:true,
          metodo_captura:"camera"
        }
      ]);

    if(error){
      console.log(error);
      mostrarMensagem("erro", "Erro ao registrar ponto.");
      botao.disabled = false;
      botao.innerHTML = `<i class="fa-regular fa-floppy-disk"></i> Registrar ponto`;
      return;
    }

    document.getElementById("tipo").value = "";
    document.getElementById("observacao").value = "";
    document.getElementById("contadorObs").innerText = "0";

    fotoCapturadaBlob = null;
    document.getElementById("fotoCapturada").src = "";
    document.getElementById("fotoCapturada").style.display = "none";
    document.getElementById("cameraVideo").style.display = "block";
    document.getElementById("cameraPlaceholder").style.display = "block";
    document.getElementById("cameraStatus").innerText = "Nenhuma foto capturada.";

    mostrarMensagem("sucesso", "✅ Ponto registrado com sucesso.");
    await atualizarTipoAutomatico(funcionarioId);

    botao.disabled = false;
    botao.innerHTML = `<i class="fa-regular fa-floppy-disk"></i> Registrar ponto`;
  }

  async function iniciar(){
    await carregarEmpresa();
    await carregarFuncionarios();
  }

  iniciar();
</script>
