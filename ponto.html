  function normalizarNomeArquivo(texto){
    return String(texto || "")
      .toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/^-+|-+$/g, "");
  }

async function obterProximoTipoPermitido(funcionarioId){
  const hoje = new Date();

  const inicioHoje = new Date(
    hoje.getFullYear(),
    hoje.getMonth(),
    hoje.getDate()
  ).toISOString();

  const amanha = new Date(
    hoje.getFullYear(),
    hoje.getMonth(),
    hoje.getDate() + 1
  ).toISOString();

  const { data, error } = await supabaseClient
    .from("registros_ponto")
    .select("tipo, data_hora")
    .eq("empresa_id", empresaId)
    .eq("funcionario_id", funcionarioId)
    .gte("data_hora", inicioHoje)
    .lt("data_hora", amanha)
    .order("data_hora", { ascending:true });

  if(error){
    console.log("Erro ao buscar registros do dia:", error);
    return null;
  }

  const funcionario =
  funcionarioLogado;

  const tiposHoje = (data || []).map(registro => registro.tipo);

  if(funcionario?.sem_intervalo === true){
    if(!tiposHoje.includes("entrada")) return "entrada";
    if(!tiposHoje.includes("saida")) return "saida";
    return "finalizado";
  }

  if(!tiposHoje.includes("entrada")) return "entrada";
  if(!tiposHoje.includes("saida_intervalo")) return "saida_intervalo";
  if(!tiposHoje.includes("retorno_intervalo")) return "retorno_intervalo";
  if(!tiposHoje.includes("saida")) return "saida";

  return "finalizado";
}
  async function validarIntervaloMinimo(funcionarioId){

  const agora = new Date();

  const cincoMinAtras =
    new Date(
      agora.getTime() - (5 * 60 * 1000)
    );

  const { data, error } =
    await supabaseClient
      .from("registros_ponto")
      .select("*")
      .eq("empresa_id", empresaId)
      .eq("funcionario_id", funcionarioId)
      .gte("data_hora", cincoMinAtras.toISOString())
      .order("data_hora", { ascending:false })
      .limit(1);

  if(error){

    console.log(
      "Erro ao validar intervalo mínimo:",
      error
    );

    return {
      permitido:false,
      motivo:"Erro ao validar intervalo."
    };
  }

  if(data && data.length > 0){

    const ultimoRegistro =
      new Date(data[0].data_hora);

    const diferencaSegundos =
      Math.floor(
        (agora.getTime() - ultimoRegistro.getTime()) / 1000
      );

    const segundosRestantes =
    Math.max(0, 300 - diferencaSegundos);

    const minutos =
      Math.floor(segundosRestantes / 60);

    const segundos =
      segundosRestantes % 60;

    return {
      permitido:false,
      motivo:`Aguarde ${minutos}m ${segundos}s para registrar novamente.`
    };
  }

  return {
    permitido:true
  };
}
  
  async function abrirCamera(){
    const video = document.getElementById("cameraVideo");
    const foto = document.getElementById("fotoCapturada");
    const placeholder = document.getElementById("cameraPlaceholder");
    const status = document.getElementById("cameraStatus");

    try{
      if(streamCamera){
        streamCamera.getTracks().forEach(track => track.stop());
      }

      streamCamera = await navigator.mediaDevices.getUserMedia({
        video:{
          facingMode:"user",
          width:{ ideal:720 },
          height:{ ideal:720 }
        },
        audio:false
      });

      video.srcObject = streamCamera;
      video.style.display = "block";
      foto.style.display = "none";
      placeholder.style.display = "none";

      fotoCapturadaBlob = null;
      status.innerText = "Câmera ao vivo aberta. Agora capture a foto.";

    }catch(error){
      console.log("Erro ao abrir câmera:", error);
      mostrarMensagem("erro", "Não foi possível abrir a câmera. Permita o acesso à câmera e tente novamente.");
    }
  }

  async function capturarFotoAoVivo(){

  const video = document.getElementById("cameraVideo");
  const canvas = document.getElementById("canvasFoto");
  const foto = document.getElementById("fotoCapturada");
  const status = document.getElementById("cameraStatus");

  if(!streamCamera || !video.videoWidth){
    mostrarMensagem("erro", "Abra a câmera antes de capturar a foto.");
    return;
  }

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  const ctx = canvas.getContext("2d");

  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );

  const imageData =
    ctx.getImageData(
      0,
      0,
      canvas.width,
      canvas.height
    );

  const pixels =
    imageData.data;

  let brilhoTotal = 0;

  for(let i = 0; i < pixels.length; i += 4){

    const r = pixels[i];
    const g = pixels[i + 1];
    const b = pixels[i + 2];

    const brilho =
      (r + g + b) / 3;

    brilhoTotal += brilho;
  }

  const brilhoMedio =
    brilhoTotal /
    (pixels.length / 4);

  if(brilhoMedio < 35){

    fotoCapturadaBlob = null;

    status.innerText =
      "Imagem muito escura.";

    mostrarMensagem(
      "erro",
      "Imagem muito escura. Certifique-se de que seu rosto está visível."
    );

    return;
  }

  status.innerText =
    "Validando rosto humano...";

  const rostoValido =
    await validarRostoHumano(canvas);

  if(!rostoValido){

    fotoCapturadaBlob = null;

    status.innerText =
      "Rosto não identificado.";

    return;
  }

  status.innerText =
  "Comparando com a foto cadastrada...";

const faceConfere =
  await validarFaceComCadastro(canvas);

if(!faceConfere){

  fotoCapturadaBlob = null;

  status.innerText =

    "Identificação facial não compatível.";

  return;

}
    
  canvas.toBlob(blob => {

    if(!blob){

      mostrarMensagem(
        "erro",
        "Erro ao capturar a foto."
      );

      return;
    }

    fotoCapturadaBlob = blob;

    const urlPreview =
      URL.createObjectURL(blob);

    foto.src =
      urlPreview;

    foto.style.display =
      "block";

    video.style.display =
      "none";

    status.innerText =
  "Foto validada com reconhecimento facial.";

    if(streamCamera){

      streamCamera.getTracks().forEach(
        track => track.stop()
      );

      streamCamera = null;
    }

  }, "image/jpeg", 0.9);
}

  async function validarRostoHumano(canvas){

  const modeloOk =

    await carregarModeloFace();

  if(!modeloOk){

    return false;

  }

  const detections =

    await faceapi.detectAllFaces(

      canvas,

      new faceapi.TinyFaceDetectorOptions({

        inputSize:224,

        scoreThreshold:0.5

      })

    );

  if(!detections || detections.length === 0){

    mostrarMensagem(
      "erro",
      "Nenhum rosto humano foi identificado. Posicione o rosto de frente para a câmera e capture novamente."
    );

    return false;
  }

  if(detections.length > 1){

    mostrarMensagem(
      "erro",
      "Mais de um rosto foi identificado. Apenas o funcionário deve aparecer na foto."
    );

    return false;
  }

  return true;
}

async function validarFaceComCadastro(canvasSelfie){

  if(!funcionarioLogado?.foto_url){

    mostrarMensagem(
      "erro",
      "Este funcionário não possui foto cadastrada para validação facial."
    );

    return false;
  }

  const modeloOk =
    await carregarModeloFace();

  if(!modeloOk){
    return false;
  }

  try{

    const imgCadastro =
      await faceapi.fetchImage(
        funcionarioLogado.foto_url
      );

    const opcoesDetector =
      new faceapi.TinyFaceDetectorOptions({
        inputSize:224,
        scoreThreshold:0.5
      });

    const deteccaoCadastro =
      await faceapi
        .detectSingleFace(
          imgCadastro,
          opcoesDetector
        )
        .withFaceLandmarks()
        .withFaceDescriptor();

    if(!deteccaoCadastro){

      mostrarMensagem(
        "erro",
        "Não foi possível identificar um rosto na foto cadastrada do funcionário."
      );

      return false;
    }

    const deteccaoSelfie =
      await faceapi
        .detectSingleFace(
          canvasSelfie,
          opcoesDetector
        )
        .withFaceLandmarks()
        .withFaceDescriptor();

    if(!deteccaoSelfie){

      mostrarMensagem(
        "erro",
        "Não foi possível identificar um rosto na selfie capturada."
      );

      return false;
    }

    const distancia =
      faceapi.euclideanDistance(
        deteccaoCadastro.descriptor,
        deteccaoSelfie.descriptor
      );

    console.log(
      "DISTÂNCIA FACIAL:",
      distancia
    );

    const limiteAceitacao =
      0.62;

    if(distancia > limiteAceitacao){

      mostrarMensagem(
        "erro",
        "Identificação facial não compatível. Tente novamente com o rosto bem iluminado e de frente para a câmera."
      );

      return false;
    }

    return true;

  }catch(error){

    console.log(
      "Erro na validação facial:",
      error
    );

    mostrarMensagem(
      "erro",
      "Erro ao comparar a selfie com a foto cadastrada."
    );

    return false;
  }
}

  function calcularDistanciaMetros(lat1, lon1, lat2, lon2){
    const R = 6371000;
    const rad = Math.PI / 180;
    const dLat = (lat2 - lat1) * rad;
    const dLon = (lon2 - lon1) * rad;

    const a =
      Math.sin(dLat / 2) * Math.sin(dLat / 2) +
      Math.cos(lat1 * rad) *
      Math.cos(lat2 * rad) *
      Math.sin(dLon / 2) *
      Math.sin(dLon / 2);

    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

    return R * c;
  }

  function obterLocalizacaoAtual(){
    return new Promise((resolve, reject) => {
      if(!navigator.geolocation){
        reject("Geolocalização não suportada neste aparelho.");
        return;
      }

      navigator.geolocation.getCurrentPosition(
        posicao => {
          resolve({
            latitude: posicao.coords.latitude,
            longitude: posicao.coords.longitude,
            precisao: posicao.coords.accuracy
          });
        },
        erro => {
          console.log("Erro GPS:", erro);
          reject("Não foi possível obter sua localização. Ative o GPS e permita o acesso à localização.");
        },
        {
          enableHighAccuracy:true,
          timeout:15000,
          maximumAge:0
        }
      );
    });
  }

  async function validarLocalizacao(){
    if(!empresaDados){
      mostrarMensagem("erro", "Dados da empresa não carregados.");
      return null;
    }

    if(!empresaDados.latitude || !empresaDados.longitude){
      mostrarMensagem("erro", "Esta empresa ainda não possui localização GPS cadastrada.");
      return null;
    }

    try{
      const localizacao = await obterLocalizacaoAtual();

      const distancia = calcularDistanciaMetros(
        Number(empresaDados.latitude),
        Number(empresaDados.longitude),
        Number(localizacao.latitude),
        Number(localizacao.longitude)
      );

      const raioPermitido = Number(empresaDados.raio_permitido_metros || 50);

      if(distancia > raioPermitido){
        mostrarMensagem(
          "erro",
          `Registro bloqueado. Você está a aproximadamente ${Math.round(distancia)}m da empresa. Limite permitido: ${raioPermitido}m.`
        );

        return null;
      }

      return {
        latitude:localizacao.latitude,
        longitude:localizacao.longitude,
        distancia_metros:Math.round(distancia)
      };

    }catch(erro){
      mostrarMensagem("erro", erro);
      return null;
    }
  }

  async function enviarFotoPonto(funcionarioId, tipo){
    if(!fotoCapturadaBlob){
      return null;
    }

    const nomeArquivo = `${empresaId}/${funcionarioId}/${tipo}-${Date.now()}-camera-ao-vivo.jpg`;

    const { error: uploadError } = await supabaseClient
      .storage
      .from("pontos")
      .upload(nomeArquivo, fotoCapturadaBlob, {
        cacheControl:"3600",
        upsert:false,
        contentType:"image/jpeg"
      });

    if(uploadError){
      console.log("Erro upload foto ponto:", uploadError);
      return null;
    }

    const { data: urlData } = supabaseClient
      .storage
      .from("pontos")
      .getPublicUrl(nomeArquivo);

    return urlData.publicUrl;
  }
