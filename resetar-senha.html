<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PontoFácil - Redefinir senha</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/supabase-client.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      min-height:100vh;
      font-family:Arial,sans-serif;
      background:linear-gradient(135deg,#f8fbff,#e8eef7);
      color:#0f172a;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }
    .card{
      width:100%;
      max-width:420px;
      background:white;
      border:1px solid #e2e8f0;
      border-radius:8px;
      padding:28px;
      box-shadow:0 20px 55px rgba(15,23,42,.10);
    }
    img{width:180px;display:block;margin:0 auto 18px}
    h1{font-size:24px;margin-bottom:8px;text-align:center;color:#0f2f66}
    p{color:#64748b;text-align:center;margin-bottom:22px;font-weight:700;line-height:1.45}
    label{display:block;font-weight:900;margin:14px 0 8px}
    input{
      width:100%;
      height:52px;
      border:1px solid #cbd5e1;
      border-radius:8px;
      padding:0 14px;
      font-size:16px;
    }
    input:focus{outline:none;border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.14)}
    button{
      width:100%;
      height:52px;
      margin-top:18px;
      border:none;
      border-radius:8px;
      background:#2563eb;
      color:white;
      font-weight:900;
      cursor:pointer;
      font-size:16px;
    }
    .message{
      display:none;
      margin-top:16px;
      border-radius:8px;
      padding:12px;
      font-weight:800;
      line-height:1.35;
    }
    .erro{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
    .sucesso{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0}
  </style>
</head>
<body>
  <main class="card">
    <img src="./pontofacil-logo-transparente.png" alt="PontoFácil">
    <h1>Redefinir senha</h1>
    <p>Digite uma nova senha para concluir a recuperação do acesso.</p>

    <label for="senha">Nova senha</label>
    <input id="senha" type="password" autocomplete="new-password" minlength="8" placeholder="Mínimo 8 caracteres">

    <label for="confirmarSenha">Confirmar senha</label>
    <input id="confirmarSenha" type="password" autocomplete="new-password" minlength="8" placeholder="Repita a nova senha">

    <button id="btnSalvar" type="button" onclick="salvarSenha()">Salvar nova senha</button>
    <div id="mensagem" class="message"></div>
  </main>

  <script>
    const supabaseClient = window.supabaseClient;
    const mensagem = document.getElementById("mensagem");
    const btnSalvar = document.getElementById("btnSalvar");

    function mostrarMensagem(tipo, texto){
      mensagem.className = `message ${tipo}`;
      mensagem.textContent = texto;
      mensagem.style.display = "block";
    }

    async function salvarSenha(){
      const senha = document.getElementById("senha").value;
      const confirmarSenha = document.getElementById("confirmarSenha").value;

      if(!supabaseClient){
        mostrarMensagem("erro", "Supabase não carregou.");
        return;
      }

      if(!senha || senha.length < 8){
        mostrarMensagem("erro", "A senha deve ter pelo menos 8 caracteres.");
        return;
      }

      if(senha !== confirmarSenha){
        mostrarMensagem("erro", "As senhas não conferem.");
        return;
      }

      btnSalvar.disabled = true;
      btnSalvar.textContent = "Salvando...";

      const { error } = await supabaseClient.auth.updateUser({
        password: senha
      });

      if(error){
        mostrarMensagem("erro", error.message || "Não foi possível redefinir a senha.");
        btnSalvar.disabled = false;
        btnSalvar.textContent = "Salvar nova senha";
        return;
      }

      mostrarMensagem("sucesso", "Senha redefinida com sucesso. Você já pode fazer login.");

      setTimeout(() => {
        window.location.href = "./login.html";
      }, 1800);
    }

    document.addEventListener("keydown", event => {
      if(event.key === "Enter") salvarSenha();
    });
  </script>
</body>
</html>
