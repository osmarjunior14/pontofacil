<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PontoFácil - Banco de Horas</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/supabase-client.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    *{box-sizing:border-box;margin:0;padding:0}

    :root{
      --azul:#2563eb;
      --azul-escuro:#0f2f66;
      --azul-noite:#071426;
      --texto:#0f172a;
      --muted:#64748b;
      --bg:#f4f7fb;
      --card:#ffffff;
      --borda:#e2e8f0;
      --verde:#16a34a;
      --vermelho:#dc2626;
      --laranja:#f97316;
      --roxo:#7c3aed;
    }

    body{
      min-height:100vh;
      font-family:Arial, sans-serif;
      background:
        radial-gradient(circle at top right, rgba(37,99,235,.10), transparent 32%),
        linear-gradient(135deg,#f8fbff,#eef3fa);
      color:var(--texto);
    }

    .layout{
      min-height:100vh;
      display:grid;
      grid-template-columns:280px 1fr;
    }

    .sidebar{
      background:
        radial-gradient(circle at top left, rgba(37,99,235,.32), transparent 38%),
        linear-gradient(180deg,#06152b,#0b2342 52%,#06152b);
      color:white;
      padding:28px 24px;
      display:flex;
      flex-direction:column;
      gap:24px;
      position:sticky;
      top:0;
      height:100vh;
      box-shadow:20px 0 60px rgba(15,23,42,.16);
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      margin-bottom:18px;
    }

    .logo-sidebar{
      width:54px;
      height:54px;
      object-fit:contain;
      flex-shrink:0;
    }

    .brand-text strong{
      display:block;
      font-size:21px;
      line-height:1;
    }

    .brand-text small{
      color:#cbd5e1;
      font-size:13px;
    }

    .menu{
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .menu button{
      width:100%;
      border:none;
      background:transparent;
      color:#cbd5e1;
      display:flex;
      align-items:center;
      gap:14px;
      padding:15px 16px;
      border-radius:14px;
      cursor:pointer;
      font-weight:800;
      font-size:15px;
      text-align:left;
      transition:.2s;
    }

    .menu button:hover,
    .menu button.active{
      background:linear-gradient(90deg,#2563eb,#1d4ed8);
      color:white;
      box-shadow:0 12px 28px rgba(37,99,235,.24);
    }

    .sidebar-footer{
      margin-top:auto;
      display:flex;
      flex-direction:column;
      gap:14px;
    }

    .empresa-card,
    .admin-card,
    .logout-card{
      border:1px solid rgba(148,163,184,.20);
      background:rgba(15,23,42,.38);
      border-radius:16px;
      padding:16px;
      backdrop-filter:blur(14px);
    }

    .empresa-card small,
    .admin-card small{
      color:#94a3b8;
      display:block;
      margin-bottom:4px;
    }

    .empresa-card strong,
    .admin-card strong{
      display:block;
      font-size:14px;
    }

    .admin-card{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .avatar{
      width:42px;
      height:42px;
      border-radius:50%;
      background:linear-gradient(135deg,#dbeafe,#93c5fd);
      color:#1e3a8a;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:900;
      flex-shrink:0;
    }

    .online{
      color:#22c55e!important;
      font-size:12px!important;
      margin-top:4px;
    }

    .logout-card{
      width:100%;
      color:#cbd5e1;
      border:none;
      display:flex;
      align-items:center;
      gap:12px;
      cursor:pointer;
      font-weight:800;
    }

    .main{
      padding:34px 42px 28px;
      min-width:0;
    }

    .topo{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:20px;
      margin-bottom:30px;
      flex-wrap:wrap;
    }

    .titulo h1{
      color:#0f274c;
      font-size:36px;
      line-height:1;
      letter-spacing:-1px;
      margin-bottom:10px;
      font-weight:900;
    }

    .titulo p{
      color:var(--muted);
      font-size:16px;
      font-weight:700;
    }

    .top-actions{
      display:flex;
      align-items:center;
      gap:14px;
      flex-wrap:wrap;
    }

    button{
      border:none;
      border-radius:14px;
      padding:14px 20px;
      font-weight:900;
      cursor:pointer;
      color:white;
      font-size:15px;
      font-family:Arial, sans-serif;
    }

    .btn-top{
      height:58px;
      padding:0 20px;
      display:flex;
      align-items:center;
      gap:10px;
      box-shadow:0 12px 30px rgba(37,99,235,.18);
    }

    .btn-voltar{background:#0f274c}
    .btn-pdf{background:linear-gradient(90deg,#2563eb,#1d4ed8)}
    .btn-filtrar{
      background:linear-gradient(90deg,#2563eb,#1d4ed8);
      width:100%;
      height:56px;
      font-size:16px;
      box-shadow:0 14px 30px rgba(37,99,235,.22);
    }

    .card{
      background:white;
      border-radius:24px;
      padding:28px;
      box-shadow:0 18px 46px rgba(15,23,42,.06);
      border:1px solid rgba(226,232,240,.90);
      margin-bottom:24px;
    }

    .filtros{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:18px;
      align-items:end;
    }

    label{
      display:block;
      font-weight:900;
      font-size:15px;
      color:#334155;
      margin-bottom:8px;
    }

    input, select{
      width:100%;
      height:56px;
      padding:0 16px;
      border:1px solid #dbe4f0;
      border-radius:16px;
      font-size:16px;
      background:white;
      font-family:Arial, sans-serif;
      color:#0f172a;
    }

    input:focus, select:focus{
      outline:none;
      border-color:#2563eb;
      box-shadow:0 0 0 4px rgba(37,99,235,.12);
    }

    h2{
      margin-bottom:20px;
      color:#0f274c;
      font-size:24px;
    }

    .resumo{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
      gap:18px;
    }

    .resumo-card{
      background:white;
      border:1px solid #e2e8f0;
      border-radius:18px;
      padding:18px;
      display:flex;
      align-items:center;
      gap:16px;
      min-height:98px;
      box-shadow:0 10px 26px rgba(15,23,42,.035);
    }

    .icone-box{
      width:48px;
      height:48px;
      border-radius:14px;
      background:#dbeafe;
      color:#2563eb;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-shrink:0;
    }

    .resumo-card small{
      color:#334155;
      font-size:14px;
      display:block;
      margin-bottom:4px;
      font-weight:800;
    }

    .resumo-card strong{
      display:block;
      font-size:26px;
      margin-top:2px;
      color:#2563eb;
    }

    .positivo{color:#166534 !important}
    .negativo{color:#dc2626 !important}
    .neutro{color:#2563eb !important}

    .tabela-wrap{
      overflow:auto;
      border:1px solid #e2e8f0;
      border-radius:18px;
    }

    table{
      width:100%;
      border-collapse:collapse;
      min-width:1000px;
      background:white;
    }

    th,td{
      padding:14px;
      border-bottom:1px solid #e2e8f0;
      text-align:left;
      font-size:14px;
      vertical-align:top;
    }

    tr:last-child td{border-bottom:none}

    th{
      background:#f8fafc;
      color:#334155;
      font-size:12px;
      text-transform:uppercase;
      letter-spacing:.3px;
    }

    .funcionario{
      font-weight:900;
      color:#0f172a;
    }

    .badge{
      display:inline-block;
      padding:6px 11px;
      border-radius:999px;
      font-size:12px;
      font-weight:900;
      margin-top:4px;
    }

    .badge-pos{background:#dcfce7;color:#166534}
    .badge-neg{background:#fee2e2;color:#991b1b}
    .badge-zero{background:#dbeafe;color:#1d4ed8}

    .vazio{
      color:#64748b;
      font-style:italic;
      padding:12px 0;
    }

    .mobile-menu{
      display:none;
      margin-bottom:18px;
      gap:10px;
      flex-wrap:wrap;
    }

    .mobile-menu button{
      border:none;
      border-radius:12px;
      background:#0f274c;
      color:white;
      padding:12px 14px;
      font-weight:900;
      cursor:pointer;
    }

    @media(max-width:1020px){
      .layout{grid-template-columns:1fr}
      .sidebar{display:none}
      .main{padding:24px}
      .mobile-menu{display:flex}
    }

    @media(max-width:700px){
      .main{padding:16px}
      .titulo h1{font-size:31px}
      .top-actions{width:100%}
      .btn-top{flex:1;justify-content:center}
    }

    @media print{
      body{background:white;padding:0}
      .layout{display:block}
      .sidebar,.top-actions,.mobile-menu,.filtros-card{display:none!important}
      .main{padding:0}
      .card{box-shadow:none;border-radius:0;margin-bottom:0;border:none}
      th,td{font-size:11px;padding:8px}
      .tabela-wrap{border:none;border-radius:0}
      .resumo-card{box-shadow:none}
    }
  </style>
</head>

<script>
  const supabaseClient = window.supabaseClient;

  let empresaId = null;
  let empresaNome = null;
  let funcionarios = [];
  let jornadasFuncionarios = [];

  async function carregarEmpresaLogada(){

  const { data: userData, error: userError } =
    await supabaseClient.auth.getUser();

  if(userError || !userData.user){

    window.location.href =
      "./gestao.html";

    return false;
  }

  const { data: vinculos, error: vinculoError } = await supabaseClient
    .from("usuarios_empresas")
    .select(`
      empresa_id,
      perfil,
      empresas (
        id,
        nome,
        email_gestao,
        ativa
      )
    `)
    .eq("user_id", userData.user.id)
    .eq("ativo", true)
    .eq("perfil", "gestor")
    .limit(1);

  if(vinculoError || !vinculos || vinculos.length === 0){

    window.location.href =
      "./gestao.html";

    return false;
  }

  const empresa =
    Array.isArray(vinculos[0].empresas)
      ? vinculos[0].empresas[0]
      : vinculos[0].empresas;

  if(!empresa){

    window.location.href =
      "./gestao.html";

    return false;
  }

  if(empresa.ativa !== true){

    await supabaseClient.auth.signOut();

    localStorage.clear();
    sessionStorage.clear();

    alert(
      "Empresa inativa. Entre em contato com o administrador do sistema."
    );

    window.location.href =
      "./gestao.html";

    return false;
  }

  empresaId =
    empresa.id;

  empresaNome =
    empresa.nome;

  document.getElementById("empresaNome").textContent =
    empresaNome || "PontoFácil";

  document.getElementById("empresaNomeSidebar").textContent =
    empresaNome || "PontoFácil";

  return true;
}

  function definirMesAtual(){
    const hoje = new Date();
    const ano = hoje.getFullYear();
    const mes = String(hoje.getMonth() + 1).padStart(2, "0");
    document.getElementById("mes").value = `${ano}-${mes}`;
  }

  function horaParaMinutos(hora){
    if(!hora) return null;

    const partes = hora.split(":");

    if(partes.length < 2) return null;

    return Number(partes[0]) * 60 + Number(partes[1]);
  }

  function minutosParaTexto(minutos){
    const sinal = minutos < 0 ? "-" : "";
    const abs = Math.abs(minutos);
    const h = Math.floor(abs / 60);
    const m = abs % 60;

    return `${sinal}${h}h${String(m).padStart(2, "0")}`;
  }

  function formatarData(dataIso){
    return new Date(dataIso).toLocaleDateString("pt-BR", {
      timeZone:"America/Sao_Paulo"
    });
  }

  function formatarHora(dataIso){
    return new Date(dataIso).toLocaleTimeString("pt-BR", {
      timeZone:"America/Sao_Paulo",
      hour:"2-digit",
      minute:"2-digit"
    });
  }

  function minutosEntre(inicio, fim){
    const minInicio = horaParaMinutos(inicio);
    const minFim = horaParaMinutos(fim);

    if(minInicio === null || minFim === null) return 0;

    return Math.max(0, minFim - minInicio);
  }

  function obterJornadaDoDia(funcionarioId, dataTexto){
    const partes = dataTexto.split("/");

    const data = new Date(
      Number(partes[2]),
      Number(partes[1]) - 1,
      Number(partes[0])
    );

    const diaSemana = data.getDay();

    return jornadasFuncionarios.find(j =>
      String(j.funcionario_id) === String(funcionarioId) &&
      Number(j.dia_semana) === Number(diaSemana)
    ) || null;
  }

  function temExpedientePrevisto(funcionario, dataTexto){
    if(!funcionario) return false;

    const jornada = obterJornadaDoDia(funcionario.id, dataTexto);

    if(!jornada) return false;

    return !!jornada.horario_entrada && !!jornada.horario_saida;
  }

  function calcularPrevistoFuncionario(funcionario, dataTexto){
    if(!funcionario) return 0;

    const jornada = obterJornadaDoDia(funcionario.id, dataTexto);

    if(!jornada) return 0;

    const entrada = jornada.horario_entrada;
    const intervalo = jornada.horario_intervalo;
    const retorno = jornada.horario_retorno;
    const saida = jornada.horario_saida;

    let total = 0;

    if(jornada.sem_intervalo === true){
      if(entrada && saida){
        total += minutosEntre(entrada, saida);
      }

      return total;
    }

    if(entrada && intervalo){
      total += minutosEntre(entrada, intervalo);
    }

    if(retorno && saida){
      total += minutosEntre(retorno, saida);
    }

    return total;
  }

  function organizarRegistros(registros){
    const mapa = {};

    registros.forEach(registro => {
      const data = formatarData(registro.data_hora);
      const chave = `${registro.funcionario_id}_${data}`;

      if(!mapa[chave]){
        mapa[chave] = {
          funcionario_id: registro.funcionario_id,
          data,
          entrada:null,
          saida_intervalo:null,
          retorno_intervalo:null,
          saida:null
        };
      }

      mapa[chave][registro.tipo] = registro;
    });

    return Object.values(mapa);
  }

  function calcularTrabalhadoDia(linha){
    let total = 0;

    const jornadaDia = obterJornadaDoDia(
      linha.funcionario_id,
      linha.data
    );

    if(jornadaDia?.sem_intervalo === true){
      if(linha.entrada && linha.saida){
        total += minutosEntre(
          formatarHora(linha.entrada.data_hora),
          formatarHora(linha.saida.data_hora)
        );
      }

      return total;
    }

    if(linha.entrada && linha.saida_intervalo){
      total += minutosEntre(
        formatarHora(linha.entrada.data_hora),
        formatarHora(linha.saida_intervalo.data_hora)
      );
    }

    if(linha.retorno_intervalo && linha.saida){
      total += minutosEntre(
        formatarHora(linha.retorno_intervalo.data_hora),
        formatarHora(linha.saida.data_hora)
      );
    }

    return total;
  }

  function badgeSaldo(saldo){
    if(saldo > 0){
      return `<span class="badge badge-pos">+${minutosParaTexto(saldo)}</span>`;
    }

    if(saldo < 0){
      return `<span class="badge badge-neg">${minutosParaTexto(saldo)}</span>`;
    }

    return `<span class="badge badge-zero">0h00</span>`;
  }

  async function carregarFuncionarios(){
    const { data, error } = await supabaseClient
      .from("funcionarios")
      .select("*")
      .eq("empresa_id", empresaId)
      .order("nome_completo");

    if(error){
      console.log("Erro ao carregar funcionários:", error);
      return;
    }

    funcionarios = data || [];

    const { data: jornadasData, error: jornadasError } = await supabaseClient
      .from("funcionario_jornadas")
      .select("*")
      .eq("empresa_id", empresaId)
      .eq("ativo", true);

    if(jornadasError){
      console.log("Erro ao carregar jornadas:", jornadasError);
      jornadasFuncionarios = [];
    }else{
      jornadasFuncionarios = jornadasData || [];
    }

    const select = document.getElementById("filtroFuncionario");

    select.innerHTML = `
      <option value="todos">Todos os funcionários</option>
      ${funcionarios.map(f => `
        <option value="${f.id}">${f.nome_completo}</option>
      `).join("")}
    `;
  }

  async function carregarBancoHoras(){
    const mes = document.getElementById("mes").value;
    const filtroFuncionario = document.getElementById("filtroFuncionario").value;
    const resultado = document.getElementById("resultado");

    if(!mes){
      alert("Selecione o mês.");
      return;
    }

    const inicio = `${mes}-01T00:00:00-03:00`;

    const [ano, mesNumero] = mes.split("-").map(Number);
    const proximoMes = new Date(ano, mesNumero, 1);
    const fimAno = proximoMes.getFullYear();
    const fimMes = String(proximoMes.getMonth() + 1).padStart(2, "0");
    const fim = `${fimAno}-${fimMes}-01T00:00:00-03:00`;

    let query = supabaseClient
      .from("registros_ponto")
      .select("*")
      .eq("empresa_id", empresaId)
      .gte("data_hora", inicio)
      .lt("data_hora", fim)
      .order("data_hora", { ascending:true });

    if(filtroFuncionario !== "todos"){
      query = query.eq("funcionario_id", filtroFuncionario);
    }

    const { data, error } = await query;

    if(error){
      console.log("Erro ao carregar registros:", error);
      resultado.innerHTML = `<div class="vazio">Erro ao carregar registros.</div>`;
      return;
    }

    const registros = data || [];

    if(registros.length === 0){
      resultado.innerHTML = `<div class="vazio">Nenhum registro encontrado para este mês.</div>`;

      document.getElementById("horasPrevistas").textContent = "0h00";
      document.getElementById("horasTrabalhadas").textContent = "0h00";
      document.getElementById("saldoPositivo").textContent = "0h00";
      document.getElementById("saldoNegativo").textContent = "0h00";

      return;
    }

    const linhas = organizarRegistros(registros).sort((a,b) => {
      const fa = funcionarios.find(f => f.id === a.funcionario_id)?.nome_completo || "";
      const fb = funcionarios.find(f => f.id === b.funcionario_id)?.nome_completo || "";

      const nomeCompare = fa.localeCompare(fb, "pt-BR");

      if(nomeCompare !== 0) return nomeCompare;

      return a.data.localeCompare(b.data, "pt-BR");
    });

    let totalPrevisto = 0;
    let totalTrabalhado = 0;
    let totalPositivo = 0;
    let totalNegativo = 0;

    const linhasHtml = linhas.map(linha => {
      const funcionario = funcionarios.find(f => f.id === linha.funcionario_id);
      const nome = funcionario?.nome_completo || "Funcionário";
      const funcao = funcionario?.funcao || "-";

      const previsto = calcularPrevistoFuncionario(funcionario || {}, linha.data);
      const trabalhado = calcularTrabalhadoDia(linha);
      const saldo = trabalhado - previsto;

      const jornadaDia = obterJornadaDoDia(linha.funcionario_id, linha.data);
      const haviaExpediente = temExpedientePrevisto(funcionario, linha.data);

      const avisoSemExpediente = !haviaExpediente
        ? `<div style="margin-top:6px; color:#f97316; font-size:12px; font-weight:900;">
            Dia sem expediente previsto
          </div>`
        : "";

      totalPrevisto += previsto;
      totalTrabalhado += trabalhado;

      if(saldo > 0) totalPositivo += saldo;
      if(saldo < 0) totalNegativo += Math.abs(saldo);

      return `
        <tr>
          <td>
            <div class="funcionario">${nome}</div>
            <div style="color:#64748b; font-size:12px;">${funcao}</div>
            ${avisoSemExpediente}
          </td>

          <td>${linha.data}</td>

          <td>${linha.entrada ? formatarHora(linha.entrada.data_hora) : "-"}</td>

          <td>
            ${jornadaDia?.sem_intervalo
              ? "Sem intervalo"
              : (linha.saida_intervalo ? formatarHora(linha.saida_intervalo.data_hora) : "-")
            }
          </td>

          <td>
            ${jornadaDia?.sem_intervalo
              ? "Sem intervalo"
              : (linha.retorno_intervalo ? formatarHora(linha.retorno_intervalo.data_hora) : "-")
            }
          </td>

          <td>${linha.saida ? formatarHora(linha.saida.data_hora) : "-"}</td>

          <td>${minutosParaTexto(previsto)}</td>
          <td>${minutosParaTexto(trabalhado)}</td>
          <td>${badgeSaldo(saldo)}</td>
        </tr>
      `;
    }).join("");

    document.getElementById("horasPrevistas").textContent =
      minutosParaTexto(totalPrevisto);

    document.getElementById("horasTrabalhadas").textContent =
      minutosParaTexto(totalTrabalhado);

    document.getElementById("saldoPositivo").textContent =
      minutosParaTexto(totalPositivo);

    document.getElementById("saldoNegativo").textContent =
      totalNegativo > 0 ? "-" + minutosParaTexto(totalNegativo) : "0h00";

    resultado.innerHTML = `
      <div class="tabela-wrap">
        <table>
          <thead>
            <tr>
              <th>Funcionário</th>
              <th>Data</th>
              <th>Entrada</th>
              <th>Saída intervalo</th>
              <th>Retorno intervalo</th>
              <th>Saída</th>
              <th>Previsto</th>
              <th>Trabalhado</th>
              <th>Saldo</th>
            </tr>
          </thead>

          <tbody>
            ${linhasHtml}
          </tbody>
        </table>
      </div>
    `;

    lucide.createIcons();
  }

  async function iniciar(){
    definirMesAtual();

    const ok = await carregarEmpresaLogada();

    if(!ok) return;

    await carregarFuncionarios();
    await carregarBancoHoras();

    lucide.createIcons();
  }

  async function logout(){

  await supabaseClient.auth.signOut();

  localStorage.clear();

  sessionStorage.clear();

  window.location.href = "./gestao.html";

}
  
  iniciar();
</script>

</body>
</html>
