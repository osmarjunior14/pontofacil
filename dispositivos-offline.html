<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PontoFácil - Dispositivos e Offline</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/supabase-client.js"></script>
  <script src="./js/security-compliance.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Arial,sans-serif;background:#f4f7fb;color:#0f172a;padding:28px}
    .wrap{max-width:1100px;margin:0 auto}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:22px}
    h1{color:#0f2f66;font-size:30px}.muted{color:#64748b;font-weight:700;line-height:1.45}
    button{height:42px;border:none;border-radius:8px;background:#2563eb;color:white;font-weight:900;padding:0 14px;cursor:pointer}
    .panel{background:white;border:1px solid #e2e8f0;border-radius:8px;padding:20px;box-shadow:0 14px 40px rgba(15,23,42,.06);margin-bottom:16px}
    table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid #e2e8f0;font-size:14px}th{color:#475569}
    .badge{display:inline-block;border-radius:999px;padding:4px 9px;font-weight:900;font-size:12px}.ok{background:#dcfce7;color:#166534}.bad{background:#fee2e2;color:#991b1b}.warn{background:#ffedd5;color:#9a3412}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="top">
      <div>
        <h1>Dispositivos e offline</h1>
        <p class="muted">Controle dispositivos confiáveis, bloqueios e marcações offline pendentes de sincronização.</p>
      </div>
      <button onclick="location.href='./rep-p-confiabilidade.html'">Voltar</button>
    </div>
    <section class="panel">
      <h2>Dispositivos</h2>
      <table>
        <thead><tr><th>Dispositivo</th><th>Plataforma</th><th>Status</th><th>Último acesso</th></tr></thead>
        <tbody id="tbodyDispositivos"><tr><td colspan="4">Carregando...</td></tr></tbody>
      </table>
    </section>
    <section class="panel">
      <h2>Fila offline</h2>
      <table>
        <thead><tr><th>Registro local</th><th>Coletado em</th><th>Status</th><th>Motivo</th></tr></thead>
        <tbody id="tbodyOffline"><tr><td colspan="4">Carregando...</td></tr></tbody>
      </table>
    </section>
  </main>
  <script>
    const supabaseClient = window.supabaseClient;
    const e = PontoFacilSecurity.escapeHtml;
    let empresaId = null;

    async function carregarEmpresa(){
      const { data:{ user } } = await supabaseClient.auth.getUser();
      if(!user){ location.href = "./gestao.html"; return false; }
      const { data } = await supabaseClient.from("usuarios_empresas").select("empresa_id").eq("user_id", user.id).eq("ativo", true).limit(1);
      empresaId = data?.[0]?.empresa_id || null;
      return !!empresaId;
    }

    function badge(texto, classe){
      return `<span class="badge ${classe}">${e(texto)}</span>`;
    }

    async function carregarDispositivos(){
      const { data } = await supabaseClient.from("rep_p_dispositivos").select("*").eq("empresa_id", empresaId).order("ultimo_acesso_em", { ascending:false });
      const tbody = document.getElementById("tbodyDispositivos");
      if(!data?.length){ tbody.innerHTML = `<tr><td colspan="4">Nenhum dispositivo registrado.</td></tr>`; return; }
      tbody.innerHTML = data.map(d => `
        <tr>
          <td>${e(d.nome_dispositivo || d.device_fingerprint)}</td>
          <td>${e(d.plataforma || "-")}</td>
          <td>${d.bloqueado ? badge("Bloqueado","bad") : d.confiavel ? badge("Confiável","ok") : badge("Pendente","warn")}</td>
          <td>${e(d.ultimo_acesso_em ? new Date(d.ultimo_acesso_em).toLocaleString("pt-BR") : "-")}</td>
        </tr>
      `).join("");
    }

    async function carregarOffline(){
      const { data } = await supabaseClient.from("rep_p_marcacoes_offline").select("*").eq("empresa_id", empresaId).order("created_at", { ascending:false });
      const tbody = document.getElementById("tbodyOffline");
      if(!data?.length){ tbody.innerHTML = `<tr><td colspan="4">Nenhuma marcação offline.</td></tr>`; return; }
      tbody.innerHTML = data.map(o => `
        <tr>
          <td>${e(o.registro_cliente_id)}</td>
          <td>${e(new Date(o.coletado_em_cliente).toLocaleString("pt-BR"))}</td>
          <td>${badge(o.status, o.status === "sincronizado" ? "ok" : o.status === "rejeitado" ? "bad" : "warn")}</td>
          <td>${e(o.motivo_rejeicao || "-")}</td>
        </tr>
      `).join("");
    }

    async function iniciar(){
      if(await carregarEmpresa()){
        await carregarDispositivos();
        await carregarOffline();
      }
    }
    iniciar();
  </script>
</body>
</html>
