<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>PontoFácil • Funcionário</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

:root{
  --azul:#2563eb;
  --azul-escuro:#0f172a;
  --bg:#f4f7fb;
  --card:#ffffff;
  --texto:#0f172a;
  --muted:#64748b;
  --verde:#16a34a;
  --vermelho:#dc2626;
  --laranja:#f97316;
}

body{
  font-family:Arial,sans-serif;
  background:linear-gradient(180deg,#f8fbff,#eef4fb);
  color:var(--texto);
  min-height:100vh;
}

.topo{
  background:linear-gradient(135deg,#0f2f66,#2563eb);
  padding:28px 22px 90px;
  color:white;
  position:relative;
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;
  font-size:30px;
  font-weight:900;
}

.logo i{
  width:34px;
  height:34px;
}

.usuario-card{
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.16);
  backdrop-filter:blur(14px);
  border-radius:22px;
  padding:18px;
  margin-top:22px;
}

.usuario-card small{
  opacity:.85;
  display:block;
  margin-bottom:6px;
}

.usuario-card strong{
  display:block;
  font-size:21px;
}

.main{
  margin-top:-60px;
  padding:0 18px 30px;
}

.card{
  background:white;
  border-radius:26px;
  padding:22px;
  margin-bottom:18px;
  box-shadow:0 18px 45px rgba(15,23,42,.08);
}

.registro-btn{
  width:100%;
  border:none;
  border-radius:22px;
  background:linear-gradient(135deg,#2563eb,#1d4ed8);
  color:white;
  padding:24px;
  font-size:22px;
  font-weight:900;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
  box-shadow:0 18px 38px rgba(37,99,235,.26);
}

.registro-btn:active{
  transform:scale(.98);
}

.status{
  margin-top:18px;
  text-align:center;
}

.status strong{
  display:block;
  font-size:20px;
}

.status span{
  color:var(--muted);
  font-size:14px;
}

.resumo-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.info-card{
  border:1px solid #e2e8f0;
  border-radius:18px;
  padding:16px;
}

.info-card small{
  color:var(--muted);
  display:block;
  margin-bottom:6px;
  font-size:13px;
  font-weight:700;
}

.info-card strong{
  font-size:24px;
  color:#2563eb;
}

.section-title{
  font-size:22px;
  font-weight:900;
  margin-bottom:18px;
}

.historico{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.item{
  border:1px solid #e2e8f0;
  border-radius:18px;
  padding:16px;
}

.item-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:8px;
}

.tipo{
  font-weight:900;
}

.badge{
  padding:6px 10px;
  border-radius:999px;
  font-size:12px;
  font-weight:900;
}

.ok{
  background:#dcfce7;
  color:#166534;
}

.erro{
  background:#fee2e2;
  color:#991b1b;
}

.local{
  font-size:13px;
  color:var(--muted);
  margin-top:6px;
}

.footer{
  text-align:center;
  padding:10px 0 30px;
}

.logout{
  border:none;
  background:#0f172a;
  color:white;
  padding:16px 22px;
  border-radius:16px;
  font-weight:900;
  cursor:pointer;
}

video,
canvas{
  display:none;
}

.loading{
  animation:pulse 1s infinite;
}

@keyframes pulse{
  0%{opacity:1}
  50%{opacity:.5}
  100%{opacity:1}
}

</style>
</head>

<body>

<div class="topo">

  <div class="logo">
    <i data-lucide="scan-face"></i>
    <span>PontoFácil</span>
  </div>

  <div class="usuario-card">
    <small>Funcionário logado</small>
    <strong id="nomeFuncionario">Carregando...</strong>
  </div>

</div>

<div class="main">

  <div class="card">

    <button class="registro-btn" onclick="registrarPonto()" id="btnRegistrar">
      <i data-lucide="scan-face"></i>
      Registrar ponto
    </button>

    <div class="status">
      <strong id="statusAtual">
        Carregando...
      </strong>

      <span id="statusDescricao">
        Aguarde...
      </span>
    </div>

  </div>

  <div class="card">

    <div class="section-title">
      Banco de horas
    </div>

    <div class="resumo-grid">

      <div class="info-card">
        <small>Saldo atual</small>
        <strong id="saldoAtual">0h</strong>
      </div>

      <div class="info-card">
        <small>Horas mês</small>
        <strong id="horasMes">0h</strong>
      </div>

    </div>

  </div>

  <div class="card">

    <div class="section-title">
      Últimos registros
    </div>

    <div class="historico" id="historico">
      <div style="color:#64748b;">
        Carregando registros...
      </div>
    </div>

  </div>

</div>

<div class="footer">
  <button class="logout" onclick="logout()">
    Sair
  </button>
</div>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<script>

const supabaseUrl =
"https://ixeeperktitbzmnvcaqz.supabase.co";

const supabaseKey =
"SUA_ANON_KEY_AQUI";

const supabase =
window.supabase.createClient(
  supabaseUrl,
  supabaseKey
);

let funcionario = null;
let empresaId = null;

async function iniciar(){

  const {
    data:{ session }
  } = await supabase.auth.getSession();

  if(!session){
    window.location.href =
    "./funcionario-login.html";

    return;
  }

  const authId = session.user.id;

  const {
    data,
    error
  } = await supabase
  .from("funcionarios")
  .select("*")
  .eq("auth_user_id", authId)
  .single();

  if(error || !data){

    alert("Funcionário não encontrado.");

    await supabase.auth.signOut();

    window.location.href =
    "./funcionario-login.html";

    return;
  }

  funcionario = data;
  empresaId = data.empresa_id;

  document.getElementById(
    "nomeFuncionario"
  ).textContent =
  funcionario.nome_completo;

  await carregarHistorico();
  await atualizarStatus();

  lucide.createIcons();
}

async function atualizarStatus(){

  const agora = new Date();

  document.getElementById(
    "statusAtual"
  ).textContent =
  agora.toLocaleTimeString(
    "pt-BR",
    {
      hour:"2-digit",
      minute:"2-digit"
    }
  );

  document.getElementById(
    "statusDescricao"
  ).textContent =
  "Sistema pronto para marcação";
}

async function carregarHistorico(){

  const {
    data,
    error
  } = await supabase
  .from("registros_ponto")
  .select("*")
  .eq("funcionario_id", funcionario.id)
  .order("data_hora", {
    ascending:false
  })
  .limit(10);

  if(error){

    document.getElementById(
      "historico"
    ).innerHTML =
    `<div>Erro ao carregar.</div>`;

    return;
  }

  if(!data.length){

    document.getElementById(
      "historico"
    ).innerHTML =
    `<div>Nenhum registro.</div>`;

    return;
  }

  document.getElementById(
    "historico"
  ).innerHTML =
  data.map(item => {

    return `
      <div class="item">

        <div class="item-top">

          <div class="tipo">
            ${formatarTipo(item.tipo)}
          </div>

          <div class="badge ok">
            Registrado
          </div>

        </div>

        <div>
          ${new Date(item.data_hora)
            .toLocaleString("pt-BR")}
        </div>

        <div class="local">
          📍 ${item.latitude || "-"},
          ${item.longitude || "-"}
        </div>

      </div>
    `;

  }).join("");
}

function formatarTipo(tipo){

  if(tipo === "entrada")
    return "Entrada";

  if(tipo === "saida_intervalo")
    return "Saída intervalo";

  if(tipo === "retorno_intervalo")
    return "Retorno intervalo";

  if(tipo === "saida")
    return "Saída";

  return tipo;
}

async function descobrirProximoTipo(){

  const hoje =
  new Date().toISOString().split("T")[0];

  const inicio =
  `${hoje}T00:00:00`;

  const fim =
  `${hoje}T23:59:59`;

  const {
    data
  } = await supabase
  .from("registros_ponto")
  .select("*")
  .eq("funcionario_id", funcionario.id)
  .gte("data_hora", inicio)
  .lte("data_hora", fim)
  .order("data_hora", {
    ascending:true
  });

  const registros = data || [];

  if(registros.length === 0)
    return "entrada";

  if(registros.length === 1)
    return "saida_intervalo";

  if(registros.length === 2)
    return "retorno_intervalo";

  if(registros.length === 3)
    return "saida";

  return null;
}

async function capturarFoto(){

  const video =
  document.getElementById("video");

  const canvas =
  document.getElementById("canvas");

  const stream =
  await navigator.mediaDevices.getUserMedia({
    video:{
      facingMode:"user"
    }
  });

  video.srcObject = stream;

  await new Promise(resolve => {
    video.onloadedmetadata = resolve;
  });

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  const ctx =
  canvas.getContext("2d");

  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );

  stream.getTracks().forEach(
    track => track.stop()
  );

  return new Promise(resolve => {
    canvas.toBlob(resolve,"image/jpeg",0.8);
  });
}

async function uploadFoto(blob, tipo){

  const nomeArquivo =
  `${funcionario.id}-${Date.now()}-${tipo}.jpg`;

  const { error } =
  await supabase.storage
  .from("registros-ponto")
  .upload(nomeArquivo, blob);

  if(error){
    console.log(error);
    return null;
  }

  const {
    data:{ publicUrl }
  } = supabase.storage
  .from("registros-ponto")
  .getPublicUrl(nomeArquivo);

  return publicUrl;
}

async function obterLocalizacao(){

  return new Promise((resolve,reject)=>{

    navigator.geolocation.getCurrentPosition(

      pos => {

        resolve({
          latitude:
            pos.coords.latitude,

          longitude:
            pos.coords.longitude
        });

      },

      erro => {
        reject(erro);
      },

      {
        enableHighAccuracy:true
      }

    );

  });
}

async function registrarPonto(){

  try{

    const btn =
    document.getElementById(
      "btnRegistrar"
    );

    btn.disabled = true;

    btn.classList.add("loading");

    btn.innerHTML =
    "Registrando...";

    const tipo =
    await descobrirProximoTipo();

    if(!tipo){

      alert(
        "Todos os registros do dia já foram realizados."
      );

      resetarBotao();
      return;
    }

    const localizacao =
    await obterLocalizacao();

    const fotoBlob =
    await capturarFoto();

    const fotoUrl =
    await uploadFoto(
      fotoBlob,
      tipo
    );

    const {
      error
    } = await supabase
    .from("registros_ponto")
    .insert([
      {
        empresa_id:empresaId,
        funcionario_id:funcionario.id,
        tipo,
        data_hora:new Date().toISOString(),
        latitude:localizacao.latitude,
        longitude:localizacao.longitude,
        foto_url:fotoUrl
      }
    ]);

    if(error){
      console.log(error);

      alert(
        "Erro ao registrar ponto."
      );

      resetarBotao();
      return;
    }

    alert(
      `${formatarTipo(tipo)} registrada com sucesso.`
    );

    await carregarHistorico();

    resetarBotao();

  }catch(err){

    console.log(err);

    alert(
      "Erro ao registrar ponto."
    );

    resetarBotao();
  }
}

function resetarBotao(){

  const btn =
  document.getElementById(
    "btnRegistrar"
  );

  btn.disabled = false;

  btn.classList.remove("loading");

  btn.innerHTML = `
    <i data-lucide="scan-face"></i>
    Registrar ponto
  `;

  lucide.createIcons();
}

async function logout(){

  await supabase.auth.signOut();

  window.location.href =
  "./funcionario-login.html";
}

iniciar();

</script>

</body>
</html>
