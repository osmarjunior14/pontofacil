<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PontoFácil - Gestão</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      font-family:Arial, sans-serif;
      background:
        radial-gradient(circle at top, rgba(37,99,235,.10), transparent 35%),
        #f4f7fb;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:22px;
      color:#0f172a;
    }

    .login-box{
      width:100%;
      max-width:520px;
      background:rgba(255,255,255,.96);
      border:1px solid rgba(226,232,240,.9);
      border-radius:34px;
      padding:64px 54px 42px;
      box-shadow:0 30px 80px rgba(15,23,42,.10);
    }

    .brand-login{
      display:flex;
      justify-content:center;
      align-items:center;
      margin-bottom:24px;
    }

    .logo-login{
      width:360px;
      max-width:88%;
      display:block;
    }

    .premium-sub{
      text-align:center;
      font-size:19px;
      color:#64748b;
      margin-bottom:38px;
      font-weight:600;
    }

    input{
      width:100%;
      height:58px;
      padding:0 18px;
      border:1px solid #dbe4f0;
      border-radius:16px;
      margin-bottom:16px;
      font-size:16px;
      background:#ffffff;
    }

    input:focus{
      outline:none;
      border-color:#2563eb;
      box-shadow:0 0 0 4px rgba(37,99,235,.12);
    }

    button{
      width:100%;
      height:58px;
      border:none;
      border-radius:16px;
      background:linear-gradient(90deg,#2563eb,#1d4ed8);
      color:white;
      font-size:17px;
      font-weight:800;
      cursor:pointer;
      margin-top:6px;
      box-shadow:0 12px 28px rgba(37,99,235,.22);
    }

    button:hover{
      filter:brightness(.96);
    }

    .erro{
      display:none;
      margin-top:16px;
      color:#dc2626;
      text-align:center;
      font-size:14px;
      font-weight:bold;
    }

    .voltar{
      margin-top:24px;
      text-align:center;
      font-size:15px;
    }

    .voltar a{
      color:#2563eb;
      text-decoration:none;
      font-weight:800;
    }

    .creditos{
      margin-top:30px;
      text-align:center;
      font-size:12px;
      color:#94a3b8;
      font-weight:500;
      letter-spacing:.3px;
    }

    @media(max-width:600px){
      .login-box{
        padding:44px 26px 34px;
        border-radius:28px;
      }

      .logo-login{
        width:300px;
      }

      .premium-sub{
        font-size:16px;
      }
    }
  </style>
</head>

<body>

<div class="login-box">

  <div class="brand-login">
    <img src="./logo-pontofacil.png" class="logo-login" alt="PontoFácil">
  </div>

  <div class="premium-sub">
    Acesso seguro à gestão da empresa
  </div>

  <input type="email" id="email" placeholder="E-mail da gestão">

  <input type="password" id="senha" placeholder="Senha">

  <button onclick="loginGestao()">
    Entrar
  </button>

  <div id="erro" class="erro">
    E-mail ou senha inválidos.
  </div>

  <div class="voltar">
    <a href="./index.html">Acesso do administrador</a>
  </div>

  <p class="creditos">
    Desenvolvido por: Osmar Júnior
  </p>

</div>

<script>
  const supabaseUrl = "https://ixeeperktitbzmnvcaqz.supabase.co";

  const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml4ZWVwZXJrdGl0YnptbnZjYXF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3Njg1MTEsImV4cCI6MjA5NDM0NDUxMX0.E4nC-w8XRpk_X7vghkGfbXuJUHQneLUJy2DLw9NsuVQ";

  const supabaseClient = window.supabase.createClient(
    supabaseUrl,
    supabaseKey
  );

  async function loginGestao(){
    const email = document.getElementById("email").value.trim();
    const senha = document.getElementById("senha").value.trim();
    const erro = document.getElementById("erro");

    erro.style.display = "none";

    if(!email || !senha){
      erro.innerText = "Preencha todos os campos.";
      erro.style.display = "block";
      return;
    }

    const { data, error } = await supabaseClient
      .from("empresas")
      .select("*")
      .eq("email_gestao", email)
      .eq("senha_gestao", senha)
      .eq("ativa", true);

    if(error){
      console.log("Erro no login da gestão:", error);
      erro.innerText = error.message;
      erro.style.display = "block";
      return;
    }

    if(!data || data.length === 0){
      erro.innerText = "E-mail ou senha inválidos, ou empresa inativa.";
      erro.style.display = "block";
      return;
    }

    const empresa = data[0];

    localStorage.setItem("pontofacil_empresa_logada", "sim");
    localStorage.setItem("pontofacil_empresa_id", empresa.id);
    localStorage.setItem("pontofacil_empresa_nome", empresa.nome);
    localStorage.setItem("pontofacil_empresa_email", empresa.email_gestao);

    window.location.href = "./painel-gestao.html";
  }
</script>

</body>
</html>
