<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PontoFácil - Painel Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/supabase-client.js"></script>

  <style>
    *{ box-sizing:border-box; margin:0; padding:0; }

    body{
      font-family:Arial, sans-serif;
      background:#f4f7fb;
      color:#0f172a;
      padding:24px;
    }

    .container{
      max-width:1100px;
      margin:auto;
    }

    .topo{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:16px;
      margin-bottom:28px;
      flex-wrap:wrap;
    }

    h1{
      color:#2563eb;
      font-size:34px;
    }

    .sub{
      color:#64748b;
      margin-top:4px;
    }

    .btn-sair{
      background:#ef4444;
      color:white;
      border:none;
      border-radius:12px;
      padding:12px 16px;
      font-weight:bold;
      cursor:pointer;
    }

    .card{
      background:white;
      border-radius:20px;
      padding:22px;
      box-shadow:0 12px 34px rgba(15,23,42,.08);
      margin-bottom:22px;
    }

    h2{
      margin-bottom:16px;
      font-size:22px;
    }

    .form-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(220px,1fr));
      gap:12px;
    }

    label{
      display:block;
      margin-bottom:6px;
      color:#334155;
      font-size:14px;
      font-weight:700;
    }

    input{
      width:100%;
      padding:14px;
      border:1px solid #dbe4f0;
      border-radius:12px;
      font-size:15px;
      background:white;
    }

    input:focus{
      outline:none;
      border-color:#2563eb;
      box-shadow:0 0 0 4px rgba(37,99,235,.12);
    }

    .btn-salvar{
      margin-top:14px;
      background:#2563eb;
      color:white;
      border:none;
      border-radius:12px;
      padding:14px;
      font-weight:bold;
      cursor:pointer;
      width:100%;
    }

    .empresa{
      border:1px solid #e2e8f0;
      border-radius:16px;
      padding:16px;
      margin-bottom:12px;
      background:#ffffff;
      display:flex;
      justify-content:space-between;
      gap:14px;
      align-items:center;
      flex-wrap:wrap;
    }

    .empresa-info{
      display:flex;
      gap:14px;
      align-items:center;
      min-width:260px;
      flex:1;
    }

    .logo-empresa{
      width:76px;
      height:76px;
      border-radius:14px;
      object-fit:contain;
      background:#f8fafc;
      border:1px solid #e2e8f0;
      flex-shrink:0;
      padding:6px;
    }

    .empresa strong{
      display:block;
      font-size:18px;
      margin-bottom:4px;
    }

    .empresa small{
      display:block;
      color:#64748b;
      line-height:1.5;
    }

    .status{
      display:inline-block;
      margin-top:8px;
      padding:5px 10px;
      border-radius:999px;
      font-size:12px;
      font-weight:bold;
    }

    .ativa{
      background:#dcfce7;
      color:#166534;
    }

    .inativa{
      background:#fee2e2;
      color:#991b1b;
    }

    .acoes{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }

    .acoes button{
      border:none;
      border-radius:10px;
      padding:10px 12px;
      color:white;
      font-weight:bold;
      cursor:pointer;
    }

    .btn-editar{
      background:#f59e0b;
    }

    .btn-status{
      background:#64748b;
    }

    .vazio{
      color:#64748b;
      font-style:italic;
      padding:10px 0;
    }

    @media(max-width:700px){
      body{ padding:16px; }
      h1{ font-size:28px; }
      .empresa{ align-items:flex-start; }
      .acoes{ width:100%; }
      .acoes button{ flex:1; }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="topo">
    <div>
      <h1>PontoFácil</h1>
      <div class="sub">Painel do administrador geral</div>
    </div>

    <button class="btn-sair" onclick="sair()">Sair</button>
  </div>

  <div class="card">
    <h2>Cadastrar empresa</h2>

    <div class="form-grid">

      <div>
        <label>Logomarca da empresa</label>
        <input id="logo" type="file" accept="image/*">
      </div>

      <div>
        <label>Nome da empresa</label>
        <input id="nome" placeholder="Nome da empresa">
      </div>

      <div>
        <label>CNPJ</label>
        <input id="cnpj" placeholder="CNPJ">
      </div>

      <div>
        <label>E-mail de gestão</label>
        <input id="email_gestao" type="email" placeholder="E-mail de gestão">
      </div>

      <div>
        <label>Senha da gestão</label>
        <input id="senha_gestao" type="password" placeholder="Senha da gestão">
      </div>

      <div>
        <label>Latitude da empresa</label>
        <input id="latitude" type="number" step="any" placeholder="-8.8829">
      </div>

      <div>
        <label>Longitude da empresa</label>
        <input id="longitude" type="number" step="any" placeholder="-36.4966">
      </div>

      <div>
        <label>Raio permitido (metros)</label>
        <input id="raio_permitido_metros" type="number" value="50" placeholder="50">
      </div>

    </div>

    <button class="btn-salvar" onclick="salvarEmpresa()">
      Salvar empresa
    </button>
  </div>

  <div class="card">
    <h2>Empresas cadastradas</h2>
    <div id="listaEmpresas">
      <div class="vazio">Carregando empresas...</div>
    </div>
  </div>

</div>

<script>
  const supabaseClient = window.supabaseClient;

  if(!supabaseClient){
    alert("Erro ao carregar Supabase.");
    throw new Error("Supabase não carregado.");
  }

  let adminLogado = null;

  async function verificarAdminLogado(){

    const {
      data:{ user },
      error:userError
    } = await supabaseClient.auth.getUser();

    if(userError || !user){

      window.location.href = "./index.html";

      return false;
    }

    const {
      data: admin,
      error: adminError
    } = await supabaseClient
      .from("administradores")
      .select("*")
      .eq("auth_user_id", user.id)
      .eq("ativo", true)
      .single();

    if(adminError || !admin){

      await supabaseClient.auth.signOut();

      localStorage.clear();
      sessionStorage.clear();

      window.location.href = "./index.html";

      return false;
    }

    adminLogado = admin;

    return true;
  }

  async function sair(){

    await supabaseClient.auth.signOut();

    localStorage.clear();
    sessionStorage.clear();

    window.location.href = "./index.html";
  }

  function normalizarNomeArquivo(texto){
    return String(texto || "")
      .toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/^-+|-+$/g, "");
  }

  function escapeTexto(texto){
    return String(texto || "")
      .replace(/\\/g, "\\\\")
      .replace(/'/g, "\\'")
      .replace(/"/g, "&quot;")
      .replace(/\n/g, " ");
  }

  async function enviarLogoEmpresa(nomeEmpresa){

    const inputLogo = document.getElementById("logo");

    if(!inputLogo.files || inputLogo.files.length === 0){
      return "";
    }

    const arquivo = inputLogo.files[0];

    const extensao =
      arquivo.name.split(".").pop().toLowerCase();

    const nomeArquivo =
      `${normalizarNomeArquivo(nomeEmpresa)}-${Date.now()}.${extensao}`;

    const { error: uploadError } = await supabaseClient
      .storage
      .from("logos")
      .upload(nomeArquivo, arquivo, {
        cacheControl:"3600",
        upsert:false
      });

    if(uploadError){

      console.log("Erro ao enviar logo:", uploadError);

      alert("Erro ao enviar logomarca.");

      return null;
    }

    const { data: urlData } = supabaseClient
      .storage
      .from("logos")
      .getPublicUrl(nomeArquivo);

    return urlData.publicUrl;
  }

  async function salvarEmpresa(){

    const nome =
      document.getElementById("nome").value.trim();

    const cnpj =
      document.getElementById("cnpj").value.trim();

    const email_gestao =
      document.getElementById("email_gestao").value.trim();

    const senha_gestao =
      document.getElementById("senha_gestao").value.trim();

    const latitude =
      document.getElementById("latitude").value;

    const longitude =
      document.getElementById("longitude").value;

    const raio =
      document.getElementById("raio_permitido_metros").value;

    if(!nome || !email_gestao || !senha_gestao){

      alert("Preencha nome, e-mail de gestão e senha.");

      return;
    }

    const logoUrl = await enviarLogoEmpresa(nome);

    if(logoUrl === null){
      return;
    }

    const { error } = await supabaseClient
      .from("empresas")
      .insert([
        {
          nome,
          cnpj,
          email_gestao,
          senha_gestao,
          logo_url: logoUrl || "",
          latitude: latitude ? Number(latitude) : null,
          longitude: longitude ? Number(longitude) : null,
          raio_permitido_metros: Number(raio || 50),
          ativa:true
        }
      ]);

    if(error){

      console.log("Erro ao salvar empresa:", error);

      alert("Erro ao salvar empresa: " + error.message);

      return;
    }

    alert("Empresa cadastrada com sucesso.");

    document.getElementById("logo").value = "";
    document.getElementById("nome").value = "";
    document.getElementById("cnpj").value = "";
    document.getElementById("email_gestao").value = "";
    document.getElementById("senha_gestao").value = "";
    document.getElementById("latitude").value = "";
    document.getElementById("longitude").value = "";
    document.getElementById("raio_permitido_metros").value = "50";

    await carregarEmpresas();
  }

  async function carregarEmpresas(){

  const lista = document.getElementById("listaEmpresas");

  lista.innerHTML =
    `<div class="vazio">Carregando empresas...</div>`;

  try{

    console.log("1. Iniciando busca de empresas...");

    const { data, error } = await supabaseClient
      .from("empresas")
      .select("*")
      .order("created_at", { ascending:false });

    console.log("2. Resposta empresas:", { data, error });

    if(error){

      lista.innerHTML =
        `<div class="vazio">Erro ao carregar empresas: ${error.message}</div>`;

      return;
    }

    if(!data || data.length === 0){

      lista.innerHTML =
        `<div class="vazio">Nenhuma empresa cadastrada.</div>`;

      return;
    }

    lista.innerHTML = data.map(empresa => `
      <div class="empresa">

        <div class="empresa-info">
          <img
            class="logo-empresa"
            src="${empresa.logo_url || ""}"
            onerror="this.style.display='none'"
          >

          <div>
            <strong>${empresa.nome || "-"}</strong>
            <small><b>CNPJ:</b> ${empresa.cnpj || "-"}</small>
            <small><b>E-mail gestão:</b> ${empresa.email_gestao || "-"}</small>
            <small><b>Latitude:</b> ${empresa.latitude ?? "-"}</small>
            <small><b>Longitude:</b> ${empresa.longitude ?? "-"}</small>
            <small><b>Raio:</b> ${empresa.raio_permitido_metros || 50}m</small>

            <span class="status ${empresa.ativa ? "ativa" : "inativa"}">
              ${empresa.ativa ? "ATIVA" : "INATIVA"}
            </span>
          </div>
        </div>

        <div class="acoes">
          <button
            class="btn-editar"
            onclick="editarEmpresa(
              '${empresa.id}',
              '${escapeTexto(empresa.nome)}',
              '${escapeTexto(empresa.cnpj)}',
              '${escapeTexto(empresa.email_gestao)}',
              '${escapeTexto(empresa.senha_gestao)}',
              '${empresa.latitude ?? ""}',
              '${empresa.longitude ?? ""}',
              '${empresa.raio_permitido_metros ?? 50}'
            )"
          >
            Editar
          </button>

          <button
            class="btn-editar"
            onclick="trocarLogoEmpresa('${empresa.id}', '${escapeTexto(empresa.nome)}')"
          >
            Trocar logo
          </button>

          <button
            class="btn-status"
            onclick="alterarStatusEmpresa('${empresa.id}', ${empresa.ativa})"
          >
            ${empresa.ativa ? "Inativar" : "Ativar"}
          </button>
        </div>
      </div>
    `).join("");

  }catch(error){

    console.log("ERRO GERAL carregarEmpresas:", error);

    lista.innerHTML =
      `<div class="vazio">Erro geral ao carregar empresas: ${error.message}</div>`;
  }
}

async function iniciar(){

  const adminOk =
    await verificarAdminLogado();

  if(!adminOk){
    return;
  }

  await carregarEmpresas();
}

iniciar();

  </script>

</body>
</html>
